[package]
name = "oo_core"
version = "0.9.0"
edition = "2021"
description = "Integrity primitives and window assembly of the onion memory, behind the Python surface"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "oo_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.22.6", features = ["extension-module"] }
sha2 = "=0.10.9"
allium = { path = "../allium" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A second net under the engine's checked arithmetic: an overflow the code did not check panics, and the guard
# in src/allium.rs answers it as engine_panic instead of wrapping silently. It covers the whole artefact.
overflow-checks = true
