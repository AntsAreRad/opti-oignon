[package]
name = "oo_core"
version = "0.1.0"
edition = "2021"
description = "Integrity primitives and window assembly of the onion memory, behind the Python surface"
license = "MIT"
publish = false

[lib]
name = "oo_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.22.6", features = ["extension-module"] }
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
