[package]
name = "allium"
version = "0.2.0"
edition = "2021"
description = "The onion companion's deterministic engine: canonical wire, fixed point, keyed randomness"
license = "MIT"
publish = false

[lib]
name = "allium"
path = "src/lib.rs"

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }

# The seeded decoder fuzz runs ten thousand genomes; unoptimised it costs the ladder half a minute.
# Overflow checks and debug assertions stay on in this profile.
[profile.test]
opt-level = 1
