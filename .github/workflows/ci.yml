# Opti-Oignon CI Pipeline
#
# Jobs, in declaration order:
#   lint          - ruff check on the Python codebase
#   public-clean  - the nomenclature, language and comment-only guards,
#                   over the diff
#   isolation     - the test windows, under both install layouts
#   typecheck     - mypy on key modules (baseline gate)
#   frontend      - svelte-check (TypeScript, baseline) + eslint
#   install       - build the distribution, install it in a fresh venv, smoke
#   security      - bandit, pip-audit, npm audit
#
# Only frontend and install are chained; both wait on lint. Every other job
# starts on its own, so one red job never hides another. Security runs
# informational (continue-on-error).
#
# This list is a contract with the reader: a job added or removed below is a
# line changed here in the same edit.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_DEFAULT: "3.12"
  NODE_VERSION: "20"

jobs:

  # -------------------------------------------------------------------
  # Lint -- ruff check on Python sources
  # -------------------------------------------------------------------
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff==0.15.18

      - name: Run ruff check
        run: ruff check opti_oignon/ --output-format=github

  # -------------------------------------------------------------------
  # Public-clean -- reject internal session nomenclature on ADDED lines
  # of a diff over the public source and test trees (diff-only, so it
  # guards against regressions without failing on pre-existing debt).
  # -------------------------------------------------------------------
  public-clean:
    name: Public-clean Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Determine diff base
        id: base
        env:
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE"
            echo "ref=origin/$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            echo "ref=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run public-clean guard (added lines only)
        run: python .github/scripts/public_clean_guard.py "${{ steps.base.outputs.ref }}"

      - name: Run public-language guard (added lines, plus the standing debt)
        run: python .github/scripts/public_language_guard.py "${{ steps.base.outputs.ref }}"

      # The two guards above look at what a diff ADDS. This one looks at what
      # a diff REMOVES: a file may shed internal nomenclature only if nothing
      # that executes leaves with it. Silent on every other kind of change.
      - name: Run comment-only guard (files that shed nomenclature)
        run: python .github/scripts/comment_only_guard.py "${{ steps.base.outputs.ref }}"

  # -------------------------------------------------------------------
  # Isolation -- the test windows, under BOTH install layouts
  #
  # An editable install registers a finder that resolves a submodule from a
  # NAME table and ignores the parent package's path. A test window that
  # stands in a parent whose path is empty therefore blocks nothing there,
  # while blocking correctly under a plain layout. Running one layout only
  # makes a whole class of void window invisible, which is how this defect
  # survived: the seal must hold under both, so both are run.
  # -------------------------------------------------------------------
  isolation:
    name: Isolation windows (${{ matrix.layout }} install)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: ["plain", "editable"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install -r requirements-backend.txt

      - name: Install the project (editable layout only)
        if: matrix.layout == 'editable'
        run: pip install -e .

      - name: Isolation-seal guard (the ledger may only shrink)
        run: python .github/scripts/isolation_seal_guard.py tests

      # The prose a client reads is generated by the framework, not written
      # in one place, so no prover here can be trusted to know the whole of
      # it. This asks the framework and compares the answer to the digest
      # committed with it. It runs in this job because this job installs the
      # backend -- and because running it under both layouts proves the
      # published surface does not depend on how the project was installed.
      - name: Published-prose guard (the schema must match its digest)
        run: python .github/scripts/published_prose_guard.py

      - name: Contracts for the shared window
        run: python -m pytest tests/test_isolation_window_contracts.py -q

      - name: Suites on the shared window
        run: |
          python -m pytest -q \
            tests/test_agent_toolset_mode_exposure_contracts.py \
            tests/test_agentic_tool_bound_capability_contracts.py \
            tests/test_quick_sandbox_turn_guard_contracts.py \
            tests/test_scheduler_curation_trigger_contracts.py \
            tests/test_bind_guard_mode_failsecure_contracts.py \
            tests/test_security_mode_yaml_failsecure_contracts.py \
            tests/test_published_prose_guard_contracts.py

  # -------------------------------------------------------------------
  # Typecheck -- mypy with baseline gate
  # -------------------------------------------------------------------
  typecheck:
    name: Typecheck (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install mypy
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run mypy
        run: |
          bash scripts/run_typecheck.sh --ci

  # -------------------------------------------------------------------
  # Frontend -- svelte-check (TypeScript, baseline) + eslint
  # -------------------------------------------------------------------
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check (svelte-check, baseline)
        working-directory: frontend
        run: |
          npx svelte-kit sync
          # Pre-existing type debt is tracked as a baseline; the build fails
          # only if NEW errors appear above it. Lower BASELINE as debt is paid down.
          BASELINE=78
          set +e
          OUT=$(npm run check 2>&1)
          set -e
          echo "$OUT" | tail -30
          ERRORS=$(echo "$OUT" | grep -oE 'svelte-check found [0-9]+ errors' | grep -oE '[0-9]+' | head -1)
          ERRORS=${ERRORS:-0}
          echo "svelte-check errors: $ERRORS (baseline: $BASELINE)"
          if [ "$ERRORS" -gt "$BASELINE" ]; then echo "::error::New type errors above the baseline ($ERRORS > $BASELINE)"; exit 1; fi
          echo "No new type errors above baseline."

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

  # -------------------------------------------------------------------
  # Install smoke -- build the distribution, install it in a fresh
  # virtualenv, and verify the CLI entry point responds.
  # -------------------------------------------------------------------
  install:
    name: Install Smoke Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Build distribution (sdist + wheel)
        run: |
          pip install build
          python -m build

      - name: Install built wheel in a fresh virtualenv
        run: |
          python -m venv /tmp/smoke-venv
          . /tmp/smoke-venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl

      - name: Smoke test (CLI entry point + metadata)
        run: |
          . /tmp/smoke-venv/bin/activate
          oo --version
          python -c "from importlib.metadata import version; print('installed opti-oignon', version('opti-oignon'))"

      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # -------------------------------------------------------------------
  # Security -- bandit, pip-audit, npm audit (informational)
  # -------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit pip-audit
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run bandit
        run: |
          bandit -r opti_oignon/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            || true

      - name: Bandit summary
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            python3 -c "
          import json
          with open('bandit-report.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          by_severity = {}
          for r in results:
              sev = r['issue_severity']
              by_severity[sev] = by_severity.get(sev, 0) + 1
          print('Bandit findings:')
          for sev in ('HIGH', 'MEDIUM', 'LOW'):
              count = by_severity.get(sev, 0)
              print(f'  {sev}: {count}')
          print(f'  Total: {len(results)}')
          "
          fi

      - name: Run pip-audit
        run: |
          pip-audit --format=json --output=pip-audit-report.json || true

      - name: pip-audit summary
        if: always()
        run: |
          if [ -f pip-audit-report.json ]; then
            python3 -c "
          import json
          with open('pip-audit-report.json') as f:
              data = json.load(f)
          vulns = [d for d in data.get('dependencies', []) if isinstance(d, dict) and d.get('vulns')]
          print(f'pip-audit: {len(vulns)} packages with known vulnerabilities')
          for pkg in vulns:
              name = pkg.get('name', '?')
              ver = pkg.get('version', '?')
              count = len(pkg.get('vulns', []))
              print(f'  {name}=={ver}: {count} vulnerability(ies)')
          "
          fi

      - name: Run npm audit
        working-directory: frontend
        run: |
          npm install --package-lock-only 2>/dev/null || true
          npm audit --json > ../npm-audit-report.json 2>/dev/null || true

      - name: npm audit summary
        if: always()
        run: |
          if [ -f npm-audit-report.json ]; then
            python3 -c "
          import json
          with open('npm-audit-report.json') as f:
              data = json.load(f)
          meta = data.get('metadata', {}).get('vulnerabilities', {})
          if meta:
              print('npm audit:')
              for sev in ('critical', 'high', 'moderate', 'low', 'info'):
                  count = meta.get(sev, 0)
                  if count:
                      print(f'  {sev}: {count}')
              total = sum(meta.values())
              print(f'  Total: {total}')
          else:
              print('npm audit: no vulnerabilities found (or no metadata)')
          "
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            npm-audit-report.json
          retention-days: 30
