[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opti-oignon"
version = "2.2.0"
description = "Local-first AI inference platform with defense-in-depth security"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Leon" },
]
keywords = [
    "llm",
    "local-first",
    "ollama",
    "inference",
    "rag",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.104.0",
    # The server's standard stack: its WebSocket implementation (the chat's
    # stream and the other WebSocket routes answer nothing without one), its
    # HTTP parser and its event loop.
    "uvicorn[standard]>=0.24.0",
    # Imported by the command-line client for the chat's stream (`oo ask`).
    "websockets>=10.4",
    "pydantic>=2.0.0",
    "starlette>=0.27.0",
    # Required by FastAPI for multipart/form-data (file upload endpoints in
    # routes_files / routes_projects / routes_rag). Without it the API fails to
    # import at startup (FastAPI raises at route-registration time).
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "ollama>=0.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "bcrypt>=4.0.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
# llama.cpp backend (direct GGUF loading without Ollama)
llama = [
    "llama-cpp-python>=0.2.0",
]
# Two-factor authentication (WebAuthn + TOTP); the WebAuthn code is written
# against python-fido2's 2.x interface.
auth = [
    "fido2>=2.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4",
]
# Post-quantum signatures (ML-DSA-65). The root of trust for signed backups,
# the model provenance seal and Veilid device keys. It was never declared as a
# dependency anywhere, so a clean install silently produced a host with no
# signature primitive at all -- and the code met that with a log line.
pqc = [
    "liboqs-python>=0.10.0",
]
# Audit chain anchor export (QR rendering). qrcode lived under `auth` alone,
# so an install without 2FA left audit_anchor_export importable but unable to
# render, which reads as a test failure rather than a missing extra.
anchor = [
    "qrcode[pil]>=7.4",
]
# SQLCipher encrypted database support.
# Migrated to sqlcipher3-binary (prebuilt wheels, no manual build step).
# The runtime in db_encryption.py imports the sqlcipher3 module, which this
# package provides; a fallback to the older binding remains in db_encryption.py
# only for hosts that already have it installed.
sqlcipher = [
    "sqlcipher3-binary>=0.5.0",
]
# Veilid peer-to-peer sync. The veilid Python bindings talk to
# a headless veilid-server (staged by scripts/fetch_veilid_server.py). Sync is a
# Daily-mode capability: it is refused under Bulbe at the binding layer
# (opti_oignon/veilid/guard.py), never auto-started, and uses private routing
# with explicit, key-addressed peers -- not arbitrary outbound requests. Like
# [llama] and [sqlcipher], [veilid] is kept OUT of [all] (see the note below):
# the bindings and the server are platform-specific and unneeded for a stock
# install. Install explicitly: pip install opti-oignon[veilid].
veilid = [
    "veilid>=0.4.0",
]
# Notes voice transcription. The whisper.cpp Python binding is used
# ONLY by the opt-in, sandboxed transcription path (opti_oignon/notes/
# transcription.py): the decrypted audio is copied into a disposable bubblewrap
# sandbox (zero host filesystem, zero network) and whisper.cpp runs there; the
# transcript is written back to the manifest only after the user approves. Like
# [llama], [sqlcipher] and [veilid], [transcribe] is kept OUT of [all]: it is
# off by default and unneeded for a stock install. Install explicitly:
# pip install opti-oignon[transcribe].
transcribe = [
    "pywhispercpp>=1.2.0",
]
# Notes picture caption / OCR. The vision/OCR Python binding is used
# ONLY by the opt-in, sandboxed caption path (opti_oignon/notes/caption.py): the
# decrypted image is copied into a disposable bubblewrap sandbox (zero host
# filesystem, zero network) and the OCR/vision tool runs there; the caption / ocr
# text is written back to the manifest only after the user approves. Like
# [llama], [sqlcipher], [veilid] and [transcribe], [vision] is kept OUT of [all]:
# it is off by default and unneeded for a stock install. Install explicitly:
# pip install opti-oignon[vision].
vision = [
    "pytesseract>=0.3.10",
]
# Development and testing
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-minify-plugin>=0.7.0",
    "pymdown-extensions>=10.0",
]
# Convenience meta-group: pure-Python extras that install cleanly via pip on a
# stock machine (auth, dev, docs).
# llama and sqlcipher are deliberately EXCLUDED from [all]. Both require
# platform-specific system libraries (libsqlcipher-dev for sqlcipher3-binary,
# build tools / a backend runtime for llama-cpp-python), so pulling them into a
# blanket [all] install breaks on machines without those prerequisites. Install
# them explicitly: opti-oignon[llama] / opti-oignon[sqlcipher]. See
# CONTRIBUTING.md for the apt / conda prerequisites.
# veilid is excluded from [all] for the same reason -- the bindings and the
# headless veilid-server are platform-specific and optional. Install explicitly:
# opti-oignon[veilid]. Sync is Daily-only and refused under Bulbe.
all = [
    "opti-oignon[auth,dev,docs]",
]

[project.scripts]
oo = "opti_oignon.cli.main:cli"

[project.urls]
Homepage = "https://github.com/AntsAreRad/opti-oignon"
Documentation = "https://opti-oignon.readthedocs.io"
Repository = "https://github.com/AntsAreRad/opti-oignon"
Issues = "https://github.com/AntsAreRad/opti-oignon/issues"

[tool.setuptools.packages.find]
include = ["opti_oignon*"]
exclude = ["tests*", "docs*", "frontend*", "scripts*", "opti_oignon.data*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# High-signal families: pycodestyle errors, pyflakes, isort, pyupgrade.
# Opinion-heavy / false-positive-prone families (N naming, B bugbear, SIM
# simplify) are intentionally left out for now and can be reintroduced
# incrementally as the codebase is cleaned.
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line length: governed by line-length, not worth the churn
    "E402",  # module-import-not-at-top: intentional (checkpoint_before_apply header, lazy loading)
    "E731",  # lambda assignment: used for short import-fallback shims
    "E741",  # ambiguous variable name
    "UP031", # printf-style formatting: cosmetic, deferred
    "UP028", # yield-in-for-loop: cosmetic, deferred
    "UP030", # format-literals: cosmetic, deferred
    "UP035", # deprecated typing imports: cosmetic, deferred
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # public re-exports and feature-grouped import blocks
"tests/*" = ["F401", "F841"]      # fixtures and intentionally-unused locals in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["opti_oignon"]
omit = ["opti_oignon/cli/*", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.pytest.ini_options]
# Superseded pins. Each file below had its contracts re-asserted, unchanged
# in what they pin, inside tests/test_semantic_cache_lookup_contracts.py on
# the shared isolation window with the hardened connection layer seeded.
# The original files stay in the tree word for word as the historical
# record; deselecting them here keeps the suite green now that the module
# refuses to run without its connection layer, which their hand-rolled
# windows never seed. Remove a line only by deleting its file.
#
# The last entry deselects a single contract rather than a file, the first
# of that kind here. Its property became false: it asserted that a
# non-Python file whose shape moved stays refused, which reported an
# absence of proof as a verdict. It stays in the tree word for word as the
# record; the replacement is C29 in the same file.
#
# C7 goes the same way. Its first half stays true; its second
# asserted a refusal where the property was that a string literal
# reaches the shape. A full purge of that string is now accepted on
# its own ground, so the spelling became false while the property
# held. The replacement is C31, which pins the shape directly.
#
# And b1 the same way. It pinned that the store asks for its configured file
# NAME, which held only while that name resolved against the caller's
# directory -- the defect that wrote a database into the repository root on
# nothing more than an import. Anchoring the path is the fix and it makes the
# old spelling false. Its first half, that the seam is reached eagerly at
# import, is re-asserted unchanged in the replacement, b35.
#
# And a1, for the same reason in the same block. It pinned that the seeded
# connector is reached AT IMPORT, because the two-factor module built its
# schema as it loaded. That is the cost R2 removes. What a1 exists for -- one
# window, both modules, the route layer resolving to the identical in-window
# singleton -- is re-asserted unchanged in a3, which pins the seam at first
# use instead.
#
# And d3, the third of the same shape. It pinned that a refusing layer leaves
# the import and the singleton alive -- still true, still fail-secure, and
# re-asserted unchanged -- and that construction CONSULTED the layer, which
# held only while the cache built its schema in its constructor. The
# consultation is still load-bearing; d15 pins it at the first connection.
#
# And h5, the fourth. It pinned that CONSTRUCTION lays out every table the
# store writes to -- true only while the constructor opened a database -- and
# that re-opening is idempotent, which is untouched and re-asserted in h35
# alongside the property that now holds: first use lays the tables out, and
# nothing before it touches storage.
#
# And l2, the fifth and the last of them. It pinned that the training store is
# opened through the encrypted helper -- still true, still the security
# property -- and that a SQL-control payload is stored verbatim rather than
# executed, which is untouched. Only the moment moved: construction opens
# nothing now, so l5 pins the helper at the first write and pins that nothing
# reaches storage before it. Its replacement lives in a file of its own rather
# than beside it: that suite is carried by the isolation seal under a byte
# digest, and adding a contract to it would have broken the seal. Regenerating
# a seal to quiet a guard is the habit the ratchet exists to break, so the
# sealed suite stays byte-identical.
# And five together, the last of this shape, because the last six databases
# opened by an import were paid in one pass. Four of the five pinned a seam by
# the MOMENT it was reached -- at import, because the store behind it opened
# its database while constructing. That moment was the defect. Each property
# they protect is re-asserted in full at the first use instead, in
# tests/test_lazy_seam_supersession_contracts.py, together with the claim that
# the import now reaches nothing: a contract that only moved its assertion
# later would have let the eager open come back. The fifth, rg4, pinned WHICH
# databases the guard ledger still carried while six were owed; the ledger is
# now pinned entry by entry, beside the decisions that emptied it.
#
# And v13, of a different shape from every one above: no seam moved and no
# moment changed. It pinned that a partial score record is completed with
# zeros and named after its key -- still true, and re-asserted -- by comparing
# the whole payload against a closed field set. That spelling quietly made the
# field set itself a contract, so widening the payload made it false without
# touching the property it exists for. The widening was owed: a model the
# governor refused never ran, and the store recorded that, but the boundary
# dropped it, so the refusal reached a client as a row of zeros
# indistinguishable from a model that ran and scored nothing. The replacement
# is v40 in the same file, which pins gap-filling and naming field by field --
# a spelling a later field cannot falsify -- and pins the refusal pair beside
# them.
#
# The four TE contracts were owed here for one block: they specified the
# tool executor asking the registry at every head while six sealed suites
# still stood on its direct path with hand-rolled windows. Those suites now
# stand on the shared window, the module has no direct path left, and the
# four lines came out the day the debt was paid, as the note said they would.
#
# zp2 pinned that nothing in the package imports the memory harness, at a
# moment when the harness was measurement only. The moment passed by design:
# the probes gate eviction, so the peels module imports them. zp4 in the same
# file keeps the live half of the property -- the harness reaches nothing on
# the chat path and never the package facade -- and adds the census control
# zp2 never had, so a silent zero cannot pass it.
#
# zp3 pinned that nothing imported the onion's modules while they were
# unwired. The executor now imports the librarian behind a guarded import,
# by design and switched off by default. zp5 in the same file pins the
# narrower live property: the executor imports the librarian and nothing
# else of the onion, and no other module imports any of it.
#
# nc1, nc2 and nc3 need the native core built: the Rust artefact the loader
# finds in opti_oignon/native. They were deselected here while no workflow had
# cargo; the native-core job now builds the crate from its lock file and runs
# them, so they are no longer deselected. A machine that runs the full sweep
# builds the artefact once first: bash scripts/build_oo_core.sh
#
# r27 and r28 pinned the benchmark runner's former transport: a client
# library the module imported itself, one client per timeout kept in a table
# of its own, and an all-zero shape when the library was absent. The module
# now asks the registry, the timeout travels as an engine option and binds
# the transport at the backend, and the reported count arrives on the chunk.
# r31 and r32 in the same file keep every property that survives -- the one
# all-zero shape, the elapsed time on a break, first-content latency, the
# reported count over the chunk count, the timeout reaching the transport --
# and drop only the table the module no longer keeps.
#
# p6 pinned that both shapes of the client's reply -- mapping and object --
# yield their content to the pre-cache warmer. The warmer no longer reads a
# client reply: it asks the registry and reads the response's content, and
# the shape-folding it pinned now lives in the backend. p9 in the same file
# keeps the live property -- the warmer asks the registry for the query's
# model with one user message and its configured budget, and stores what
# comes back -- beside p7, which kept its own: no backend is a recorded
# failure with a reason.
#
# rf1, rf5, rf6, rf7 and rf10 read the registry-funnel ledger for an owed
# name: rf1 asserted the ledger was not empty, the other four took its first
# entry as their fixture. The ledger is empty since the third convergence
# block paid its last eleven modules, so each of them is red by construction
# while its property still holds. rf11 to rf15 in the same file keep every
# property on a synthetic ledger the contract writes itself, and rf16 pins
# what an empty ledger newly needs: the guard refuses an estate it could
# not scan, and its green names how many modules it read.
#
# q1 pinned the schema module's class count as a literal, 323. The onion's
# user surface adds seven schemas; q33 in the same file keeps every other
# assertion of q1 word for word at 330 and names the seven, so the next
# surface that moves the count has to name what it adds too. The q26
# required-field census is a snapshot map, not an assertion; it gained the
# seven entries the way it gained every earlier one.
#
# zp5 pinned that the executor is the only module importing the onion. The
# user's surface on the Core -- pin, supersede, recall -- is a memory route,
# so the routes' handlers import the librarian too; zp6 in the same file
# keeps every property of zp5 (stdlib only at module scope, the librarian
# and nothing else, the facade out of it) over the two importers and pins
# what the surface newly needs: the model's tools reach no onion module.
#
# ax1, ax2 and np6 drove the tuner's Ollama benchmark through a stand-in
# requests module, because the benchmark posted to the server's HTTP
# endpoint itself and so skipped the governor's admission. It now asks the
# registry's Ollama backend; ax4, ax5 and np11 in the same files keep every
# assertion of the three word for word over a scripted backend, and np11
# adds that a reply reporting no counters claims nothing.
#
# rf22 and rf23 named the five modules the raw-HTTP census found. The RAG
# embedder now asks the registry, so the raw ledger holds four; rf24 and
# rf25 in the same file keep every assertion of the two over the four and
# add that the embedder posts no more.
#
# rf24 and rf25 named the four modules left on the raw ledger. The red team
# now asks the registry, its loopback check on the backend's endpoint, and
# the launcher's probe is exempt by name; rf26 and rf27 in the same file
# keep the properties over an empty ledger and pin the exemption.
#
# oh2 to oh5 routed Ollama to a host off the machine in an isolation window,
# where the security mode reads as Bulbe. Bulbe now refuses that, so oh6 to
# oh9 in the same file keep every assertion of the four in Daily mode.
#
# zp6 pinned the librarian's importers as exactly the executor and the
# memory routes. The terminal chat session is a third user surface: its
# /open, /close, /pin and /recall are the user's actions on the onion. zp7
# in the same file keeps every property of zp6 over the three importers and
# pins what the new surface needs: the routes and the session reach the
# librarian inside a function, never at module scope.
#
# cq10 pinned, among its assertions, that the health monitor discovers an
# empty model list when no backend is registered. Under the listing
# doctrine no backend is nobody looking, so discovery answers unknown;
# cq13 in the same file keeps every other assertion of cq10 word for word
# and pins that one as None.
#
# rd2 pinned that a remote core with no daemon behind it lists an empty
# catalogue. The listing head now follows the doctrine of the other two
# observation heads -- None when nobody could look, an empty list only
# after a real look -- so an absent daemon is an unknown listing and rd2's
# last assertion is false by construction while its property holds. rd4 in
# the same file keeps every other assertion of rd2 word for word (unhealthy,
# refusal by name on generate and stream, client untouched) and pins what
# the doctrine newly needs: unknown crosses the wire as a null listing with
# ``known`` false, and a known empty as an empty listing with ``known`` true.
#
# d26, d27 and d28 pinned the model listing of the dependency layer as it
# was: the registry asked first through a ``get_backend`` method the real
# registry never had, then the direct client as the fall-through, with the
# client's answer shapes folded in the function. The fourth convergence
# block sent the listing through the registry's active backend and removed
# the fall-through, so d26 asserts a method that is gone and d27/d28 assert
# a route that no longer exists. d31 and d32 in the same file keep the live
# property -- empty and missing answers become lists -- and pin what the
# removal newly needs: the client library is never reached, whatever the
# registry does.
#
# cv8 kept, as its capability control, that the warmup still called the
# client directly and that the counter saw it. The warmup asks the registry
# now. cx9 in the third convergence suite keeps the property over all
# eleven paid modules and proves the counter on a synthetic direct site and
# a synthetic ps() read.
#
# r32 and r33 of the benchmark route suite pinned the client's absence by its
# flag and by its message. The route asks the registry now and has no flag;
# r35 and r36 in the same file keep both properties -- an empty installed
# list, and a single test degraded to an error row with every field as it was
# -- against a registry the window proves unreachable.
#
# fn1 and fn6 pinned the last database the package import opened, branches.db,
# as a control that the probe could see an open and as the one entry the ledger
# kept. The package facade no longer imports the module that opens it, so the
# import opens nothing and the ledger is empty: both premises are gone. fn8 and
# fn9 in the same file keep the live properties -- nothing opens at package
# import, the probe proves it can see an open, and the flag-bearing module still
# opens its database at its own import.
#
# Ten more of the same family, one per store the sobriety block deferred:
# cl6, cs4, hs5, ms5, st4, tf4, fp6, fp7, fa5 and lr5 each kept, as their
# capability control, that the import still opened SOME database, loaded SOME
# heavy module, or that the ledger still carried something. Those controls
# were right while the package import reached the API application; the facade
# no longer does, and every one of them is now empty by design. Each has a
# successor in its file that keeps the property and proves capability on a
# synthetic ledger entry or on the module count instead.
#
# c5 and ox5 each pinned a seam that is gone. c5 read the correction prompt
# off a client object the self-correction module used to hold; the module
# now asks the inference registry, and c7 in the same file reads the same
# prompt off the registry's request and keeps the cap of three. ox5 asserted
# the dynamic pipeline's client flag, which left with the client; ox7 in the
# same file keeps the live property: one request on the step model through
# the registry, and a plain marker with zero requests when no backend serves
# it.
# pn1 pinned, among its assertions, that the engine exports exactly four
# tables, spelled as a closed list. The journal adds a fifth table, so the
# closed spelling is false while the property holds: both engines export the
# same tables. pn14 in the same file keeps every other assertion of pn1 word
# for word and pins the table list against lawfiles.TABLES, which a later
# table cannot falsify, plus the four names pn1 named.
#
# pn14 compared the exported table list with lawfiles.TABLES, the very list
# the reference builds the export from, so the comparison held by
# construction and a table file on disk that no engine exports left it green.
# pn15 in the same file keeps every other assertion of pn14 word for word and
# reads the table list from the table files on disk, with a witness that the
# read finds the four names pn1 named.
#
# ae1 pinned, among its assertions, that the fixture's whole enzyme column is
# the one row its dominance cases build, and ae2 a floor of 1284 compared
# requests, the count its corpus reached at its birth. The fixture genome
# gained the reserve's three enzyme loci, so the column holds four rows and
# three fewer of the thousand seeded mutations decode: both spellings are
# false while both properties hold. ae15 in the same file keeps every other
# assertion of ae1 word for word and pins the property: the two columns are
# equal, locus 7's row is the maximum in both, and the column holds a row per
# enzyme locus of the fixture law, counted from the law, more than one. ae16
# keeps every other assertion of ae2 word for word and pins the floor
# re-measured under the current laws, 1281.
#
# cs4 of the cache surface suite (not the conversation schema's cs4 above)
# held the frontend's side of the published prefix by requiring the prefix
# inside the chat control bar, where it stood only in two raw requests. The
# control bar now reaches the cache through the API layer, which spells the
# prefix, so that literal is gone while the property holds. cs8 in the same
# file keeps every other assertion of cs4 -- the API layer speaks the
# prefix, no frontend file carries the legacy token, in either case -- and
# pins what the move needs: every component that shows the cache switch
# reaches it through the API layer and spells no path of its own, the list
# computed rather than named, so the switch can move without a data edit.
#
# The wiring half of ux11 (tests/test_ui_repairs_contracts.py) ended on an
# assertion that the preferences store sets the two motion classes the
# scroll behaviour reads. The store no longer writes the root element: the
# theme path (lib/theme/apply.ts) and the pre-render in app.html alone set
# the palette, the dark class, the density, the root font size, the motion
# classes and the componion switch, so that literal is gone while the
# property holds. ds20 in tests/test_design_tokens_contracts.py keeps every
# other assertion of that half -- no literal smooth scrolling outside
# lib/motion.ts, every scroll option taken from scrollBehavior() and
# imported from lib/motion -- and pins the property where it now lives: the
# classes the theme path sets for each motion choice, run under Node, are
# exactly the ones motion.ts reads. The node half of ux11 stays selected.
#
# The host half of pr6 (tests/test_ui_primitives_contracts.py) required the
# app shell to host the right panel in the side panel primitive. The shell is
# now the frame of every page of both spaces, with its default slot alone and
# no panel; the chats' side panels moved with the chat frame (the chats'
# layout), which hosts them in the same primitive. pr10 in the same file keeps
# every assertion of that half word for word, read on the chat frame: it
# imports the primitive, hosts one, gives it its width and takes its resizes,
# and holds no resize logic and no panel of its own; and it adds that the
# shell hosts no side panel and no resize. The landmark and resize halves of
# pr6 stay selected.
#
# Both halves of ux13 (tests/test_ui_repairs_contracts.py) read the settings
# page and the sidebar's list of settings sections, which are gone: the
# settings hub renders the catalog's groups on the Preferences and Workshop
# pages, and the sidebar lists destinations. ux17 in the same file keeps
# every other assertion of ux13 word for word, reading the hub where ux13
# read the page: its loaders are the catalog's panels, its introductions
# render the catalog's inline groups under the sections that render them,
# no other file declares a section list or the old tab map, and a list of
# three tabs is no section list (the census's precision). It drops exactly
# two reads: of the section list, which no longer exists, and of the
# catalog's section resolver, which nothing calls any more (the old
# addresses are resolved by lib/nav/legacy.ts); and it adds that the hub
# alone loads the panels.
#
# a23 to a26 of the RAG store suite pinned the store's own client library as
# the transport of a URL ingestion: a23 that the store refuses without it,
# a24 to a26 the oversize refusal, the short page and the ingested page, each
# through a stand-in for that library. The store now fetches through the web
# search module's page fetcher, which opens the web gate before every request
# and reaches only a public address, and it holds no client of its own: a24
# to a26 are false as written, and a23 would pass only because its window
