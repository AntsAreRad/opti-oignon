# Opti-Oignon chat tool-loop eval -- French-language data suite v1.
#
# Same instrument as the baseline suite, with French task data: prompts,
# fixtures, tool arguments and scripted answers carry accented characters
# and typographic apostrophes, so the hygiene checkers and the transcript
# machinery are exercised end to end on the text the platform actually
# serves. Comments and identifiers stay in English per the project rule;
# the French lives in the data only.
#
# Two tasks go beyond plain accent coverage:
#   - f03 scripts a failed write through the reserved readonly/ prefix
#     (see SCRIPTED_READONLY_PREFIX in the harness) and its recovery, so
#     the executor's verification pass runs a real corrective iteration.
#   - f04 chains eight tool calls, long enough that the growth curve of
#     the decision context separates the transcript modes measurably.
#
# Every task is green by construction -- the suite is a baseline
# instrument, not a trap set. Scripted answers speak in first person and
# never quote runtime scaffolding. Checks are built-in checker names.

suite: chat_tools_fr

tasks:
  - id: f01-lecture-simple
    title: Read one file and report its content (French)
    prompt: >
      Lis le fichier notes.txt et dis-moi précisément ce qu’il contient.
    fixture:
      notes.txt: "Les sauvegardes s'exécutent chaque nuit à 02 h 00.\n"
    checks:
      - "expect_tool:read_file"
      - "max_calls:1"
      - "final_nonempty"
      - "no_misattribution"
      - "no_internal_markers"
      - "tools_before_stream"
    script:
      - tool_calls:
          - name: read_file
            arguments: {filename: notes.txt}
      - content: ""
      - content: >
          J’ai lu notes.txt avec mon outil read_file ; il contient une
          seule ligne indiquant que les sauvegardes s’exécutent chaque
          nuit à 2 h.

  - id: f02-chaine-multi
    title: List, read, then write a summary (French, accented filenames)
    prompt: >
      Liste les fichiers de l'espace de travail, lis état.txt, puis écris
      un résumé d'une ligne dans résumé.txt.
    fixture:
      état.txt: "Tous les services sont nominaux.\nFile d'attente : 3.\n"
    checks:
      - "expect_tool:write_file"
      - "expect_file:résumé.txt"
      - "max_calls:3"
      - "final_nonempty"
      - "no_misattribution"
      - "no_internal_markers"
      - "tools_before_stream"
    script:
      - tool_calls:
          - name: list_files
            arguments: {}
      - tool_calls:
          - name: read_file
            arguments: {filename: état.txt}
      - tool_calls:
          - name: write_file
            arguments:
              filename: résumé.txt
              content: "Services nominaux ; file d'attente : 3.\n"
      - content: ""
      - content: >
          J'ai listé l'espace de travail, lu état.txt et écrit un résumé
          d'une ligne dans résumé.txt à l'aide de mes outils de fichiers.
          Tout est nominal, avec une file d'attente de trois éléments.

  - id: f03-ecriture-verrouillee
    title: Recover from a scripted write failure (verification pass)
    prompt: >
      Écris le journal de rotation dans readonly/journal.txt ; si
      l’écriture échoue, écris-le plutôt dans journal.txt et confirme.
    checks:
      - "expect_tool:write_file"
      - "expect_file:journal.txt"
      - "max_calls:2"
      - "final_nonempty"
      - "no_misattribution"
      - "no_internal_markers"
      - "tools_before_stream"
    script:
      - tool_calls:
          - name: write_file
            arguments:
              filename: readonly/journal.txt
              content: "La rotation des journaux est terminée.\n"
      - content: ""
      - tool_calls:
          - name: write_file
            arguments:
              filename: journal.txt
              content: "La rotation des journaux est terminée.\n"
      - content: ""
      - content: >
          Ma première écriture vers readonly/journal.txt a échoué, ce
          chemin étant en lecture seule ; j’ai donc écrit le journal de
          rotation dans journal.txt : la rotation est terminée.

  - id: f04-chaine-longue
    title: Eight-call inventory chain (transcript growth measurement)
    prompt: >
      Fais l'inventaire complet de la configuration : liste les fichiers,
      lis chacun des six fichiers de configuration, puis écris un rapport
      d'une ligne dans rapport.txt.
    max_rounds: 12
    fixture:
      config-a.txt: "Réseau : liaison locale uniquement, passerelle désactivée.\n"
      config-b.txt: "Stockage : base chiffrée, clé dérivée au déverrouillage local.\n"
      config-c.txt: "Modèles : sélection locale, aucun appel réseau sortant autorisé.\n"
      config-d.txt: "Journalisation : horodatage monotone, rotation quotidienne à 02 h.\n"
      config-e.txt: "Sécurité : bac à sable obligatoire pour toute exécution de code.\n"
      config-f.txt: "Interface : thème sombre par défaut, contraste élevé disponible.\n"
    checks:
      - "expect_tool:write_file"
      - "expect_file:rapport.txt"
      - "max_calls:8"
      - "final_nonempty"
      - "no_misattribution"
      - "no_internal_markers"
      - "tools_before_stream"
    script:
      - tool_calls:
          - name: list_files
            arguments: {}
      - tool_calls:
          - name: read_file
            arguments: {filename: config-a.txt}
      - tool_calls:
          - name: read_file
            arguments: {filename: config-b.txt}
      - tool_calls:
          - name: read_file
            arguments: {filename: config-c.txt}
      - tool_calls:
          - name: read_file
            arguments: {filename: config-d.txt}
      - tool_calls:
          - name: read_file
            arguments: {filename: config-e.txt}
      - tool_calls:
          - name: read_file
            arguments: {filename: config-f.txt}
      - tool_calls:
          - name: write_file
            arguments:
              filename: rapport.txt
              content: "Inventaire : six sections de configuration relues, tout est cohérent.\n"
      - content: ""
      - content: >
          J'ai listé l'espace de travail, relu les six fichiers de
          configuration un par un, puis écrit un rapport d'une ligne dans
          rapport.txt : l'inventaire complet est cohérent.
