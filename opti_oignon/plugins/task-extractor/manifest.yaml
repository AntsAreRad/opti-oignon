name: task-extractor
version: "1.0.0"
author: Opti-Oignon
description: >
  Automatically extracts action items and TODOs from LLM responses.
  Maintains a persistent task list in SQLite. Manage tasks via slash
  commands: /tasks, /tasks done, /tasks clear.
entry_point: entry_point.py
hooks:
  - post_inference
  - tool_call
dependencies: []
permissions:
  - conversation_read
  - tool_register
  - filesystem_plugin_dir
min_opti_version: "1.10.0"
config_schema:
  auto_extract:
    type: boolean
    default: true
    description: Automatically extract tasks from every response
  patterns:
    type: string
    default: "you should,next step,todo:,action item,make sure to,don't forget to,remember to"
    description: Comma-separated trigger patterns for task detection
  max_tasks:
    type: integer
    default: 200
    description: Maximum number of stored tasks
