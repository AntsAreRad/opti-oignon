# Pending writes: the agent's memory and notes writes that the user's typed
# words did not endorse wait here for the user's review (see
# opti_oignon/pending_writes.py).

# The most proposals one agent run may make. A further write of that run
# that needs a proposal is refused, with nothing saved; the round's later
# calls are not run, and the run ends with the stop reason proposal_cap: a
# page that tells the agent to write again and again cannot flood the
# review, and the run says why it stopped. A write the user's typed words
# endorse is never counted. A whole number from 1 to 1000; any
# other value keeps the default below.
max_per_run: 20

# Seconds after which an acceptance that never finished (the process ended
# between taking the proposal and recording what it wrote) is completed by
# the next review: settled if its write landed, written once otherwise. A
# whole number from 60 to 86400; any other value keeps the default below.
stale_claim_seconds: 300
