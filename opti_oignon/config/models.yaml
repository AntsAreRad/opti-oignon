# =============================================================================
# OPTI-OIGNON v1.4.0 — MODELS CONFIGURATION
# =============================================================================
# Ce fichier definit le mapping entre types de taches et modeles Ollama.
# Modifier selon les modeles installes sur votre machine.
#
# Pour voir les modeles disponibles: ollama list
# =============================================================================

# -----------------------------------------------------------------------------
# ROUTING: type de tache → modele Ollama
# -----------------------------------------------------------------------------
# Chaque type peut avoir:
#   primary  — modele principal (meilleur qualite)
#   fast     — modele rapide (reponses courtes)
#   quality  — modele premium (taches critiques)
# -----------------------------------------------------------------------------
routing:
  code_r:
    primary: "qwen3-coder:30b"
    fast: "qwen3-coder:30b"
    quality: "qwen3-coder-next:latest"
  code_python:
    primary: "qwen3-coder:30b"
    fast: "qwen3-coder:30b"
    quality: "qwen3-coder-next:latest"
  debug_r:
    primary: "qwen3-coder:30b"
  debug_python:
    primary: "qwen3-coder:30b"
  scientific_writing:
    primary: "qwen3:32b"
    quality: "deepseek-r1:32b"
  planning:
    primary: "qwen3:32b"
  planning_deep:
    primary: "deepseek-r1:32b"
  linux:
    primary: "qwen3-coder:30b"
  simple_question:
    primary: "qwen3:32b"
    fast: "nemotron-3-nano:30b"
  unknown:
    primary: "qwen3:32b"
    fast: "nemotron-3-nano:30b"

  # Types generiques utilises par le router
  general:
    primary: "qwen3:32b"
    fast: "nemotron-3-nano:30b"
    quality: "qwen3.5:35b"
  code:
    primary: "qwen3-coder:30b"
    quality: "qwen3-coder-next:latest"
  reasoning:
    primary: "deepseek-r1:32b"
    quality: "qwen3.5:35b"
  creative:
    primary: "qwen3:32b"
    quality: "qwen3.5:35b"
  vision:
    primary: "qwen3-vl:32b"

# -----------------------------------------------------------------------------
# FALLBACK: ordre de preference si le modele principal n'est pas disponible
# -----------------------------------------------------------------------------
fallback_order:
  - "qwen3-coder:30b"
  - "qwen3:32b"
  - "qwen3.5:35b"
  - "deepseek-r1:32b"
  - "nemotron-3-nano:30b"
  - "qwen3-coder-next:latest"

# -----------------------------------------------------------------------------
# MODELES SPECIAUX
# -----------------------------------------------------------------------------
special:
  embeddings: "mxbai-embed-large"
  summary: "nemotron-3-nano:30b"
  vision: "qwen3-vl:32b"

# -----------------------------------------------------------------------------
# BLACKLIST: modeles a eviter (performances insuffisantes)
# -----------------------------------------------------------------------------
blacklist: []
  # - model: "mistral:7b"
  #   reason: "Trop petit pour les taches complexes"

# -----------------------------------------------------------------------------
# TEMPERATURES par type de tache
# -----------------------------------------------------------------------------
temperatures:
  code: 0.2
  debug: 0.1
  analysis: 0.3
  creative: 0.7
  general: 0.5
  scientific_writing: 0.3
  planning: 0.4

# -----------------------------------------------------------------------------
# TIMEOUTS (secondes)
# -----------------------------------------------------------------------------
timeouts:
  default: 300
  quick: 60
  long: 600

# -----------------------------------------------------------------------------
# CONTEXT WINDOWS — tailles verifiees (tokens)
# -----------------------------------------------------------------------------
# Utilise par context_manager.py pour le budget allocation
# Si un modele n'est pas liste, Ollama est interroge dynamiquement
# -----------------------------------------------------------------------------
context_windows:
  "qwen3-coder:30b": 262144
  "qwen3:32b": 262144
  "deepseek-r1:32b": 131072
  "nemotron-3-nano:30b": 1048576
  "mxbai-embed-large": 8192
