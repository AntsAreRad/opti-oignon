# Resource Governor configuration.
#
# The measurement path consumes the measurement subset: enabled, total_vram_gb,
# safety_margin_gb, snapshot_ttl_s, kv_coefficient, ceiling_floor_gb,
# decisions_ring_size. Admission, backpressure, the queue, the limits and
# the offload policy consume the rest.

# Gates admission; measurement itself stays available regardless of this
# flag.
enabled: true

# Total VRAM capacity in GB. A value here is authoritative and the host is
# never probed for it. null means ASK THE HOST: the governor reads the total
# from nvidia-smi through the live-metrics collector, and the snapshot reports
# capacity_source as "probe" rather than "config". If that reading is also
# unavailable -- no card, no nvidia-smi, a failed query -- the capacity stays
# UNKNOWN, measurement reports disabled_capacity_unknown, and any future
# admission stays fail-open with a logged warning (spec Section 3.1). Set this
# explicitly to override the reading or to work on a host without nvidia-smi.
total_vram_gb: null

# Subtracted by the admission fit math (spec Section 4.2); also the
# fast-down margin of the ceiling learning (spec Section 3.2). The
# speculative_decoding precedent value.
safety_margin_gb: 1.5

# Snapshot cache TTL in seconds (spec Section 3). The ps view is a socket
# round trip and must not run synchronously on every admission.
snapshot_ttl_s: 2.0

# KV-cache estimate: GiB of KV per 1024 tokens of the requested num_ctx
# (design decision DI-4: layers folded into one conservative,
# deliberately high-side coefficient; refined by measure-and-adapt).
kv_coefficient: 0.5

# Per-model KV-cache overrides consumed by the admission cost math.
# Resolution order: exact model name > longest matching family substring
# > the global kv_coefficient above, which stays the fail-secure answer
# for any model neither table names. Matching is case-insensitive.
# Example -- a GQA MoE whose real KV at 256K tokens is a few GiB:
#   models:
#     "qwen3.6-35b-a3b:latest": 0.03
#   families:
#     "qwen3.6": 0.03
kv_overrides:
  models: {}
  families: {}

# Per-model weights-residency overrides in GiB. The MoE gap: a
# Mixture-of-Experts model's resident weights can differ from its file
# size (active-params vs total-params). Resolution: exact model name
# > longest matching family substring > the estimator chain unchanged,
# which stays the fail-secure answer for any model neither table names
# (an unknown model prices exactly as today). Matching is
# case-insensitive. Calibrate against a live observation on the host;
# example:
#   models:
#     "qwen3.6-35b-a3b:latest": 4.5
#   families:
#     "qwen3.6": 4.5
weights_overrides:
  models: {}
  families: {}

# The learned capacity ceiling never drops below this floor in GB
# (spec Section 3.2, the fast-down bound).
ceiling_floor_gb: 4.0

# Bounded ring of recent admission decisions, pruned by count
# (spec Section 3.2; written by the admission path).
decisions_ring_size: 200

# --- Admission's context shaping, backpressure, queue and limits ---

# The downsize ladder and the per-caller context floors
# (benchmark/AGT have no floor entry: they never downsize, D3).
ctx_ladder: [32768, 16384, 8192, 4096]
ctx_floor:
  chat: 4096
  pipeline: 4096

# Backpressure.
idle_evict_threshold_s: 600
pressure:
  soft_threshold: 0.85
  hard_threshold: 0.95
  # Soft-or-worse pressure must persist this long before the governor
  # writes the warmup keep_alive (restored at the first clear).
  sustain_s: 60.0
  # The bounded window the refusal-rate signal reads.
  refusal_window_s: 60.0
pressure_keep_alive: "5m"
queue:
  enabled_per_caller: {}
  depth: 2
  wait_s: 30

# Optional in-process rlimits (off by default) and Ollama limit
# management (spawn-path env application; advisory for external servers).
# Caveat (why rlimits ships off): setrlimit is process-wide -- it caps the
# ENTIRE Opti-Oignon process, not the llama.cpp backend alone. Admission
# accounting (R-01) remains the primary control.
rlimits:
  enabled: false
  as_gb: null
  data_gb: null
ollama_limits:
  max_loaded_models: null
  num_parallel: null
  max_queue: null
  spawn_applies: true
  external_advisory: true

# Dynamic context quantum. When enabled, the admitted num_ctx lands on
# the ctx_ladder above (a between-steps request rounds UP so a growing
# conversation keeps one stable quantum across turns), capped by a live
# ceiling derived from the VRAM left after weights through the KV
# coefficient. Unknown capacity caps the quantum to unknown_ctx_ceiling
# instead of passing the raw request through: the admission itself stays
# fail-open, only the quantum is fail-secure. Rollback: enabled false.
dynamic_ctx:
  enabled: false
  unknown_ctx_ceiling: 8192

# Partial offload. A model the GPU cannot hold, even after evicting idle
# models, is admitted split between VRAM and system RAM when the VRAM free
# now and the RAM above the reserve hold it together. Ollama places the
# layers itself (no num_gpu is sent); llama.cpp in process, which puts every
# layer on the GPU unless n_gpu_layers says otherwise, refuses such a split
# by name instead of failing for memory at the load. A split never waits on
# an eviction, and RAM that cannot be read means no split: the refusal
# stands, naming what the GPU alone lacks.
#   prefer          -- context: keep the requested context and split before
#                      stepping down the ladder; speed: step down the ladder
#                      on the GPU alone first, and split only at the last step.
#   min_gpu_share   -- the smallest share of the cost a split may leave on the
#                      GPU, from 0.0 to 1.0 (0.0: refuse only when VRAM and
#                      RAM together are too small).
#   ram_reserve_gb  -- the RAM a split leaves to the rest of the machine,
#                      in GB, 0.0 or more.
# A value out of its range is ignored for its default, with a warning.
# Rollback: enabled false gives back the decisions made before offload.
offload:
  enabled: true
  prefer: context
  min_gpu_share: 0.0
  ram_reserve_gb: 4.0
