# Context Optimizer Configuration — Opti-Oignon
# ===================================================
# Controls the unified context window orchestrator.
# When enabled, replaces the manual 5-step pipeline in executor.py.

# Master toggle (default: true). Setting this to false falls back to the
# manual pipeline in the caller; this line is the whole rollback.
enabled: true

# Priority presets — predefined zone weight profiles
# Each preset overrides allocation ratios from token_budget.yaml
priority_presets:
  balanced:
    system_ratio: 0.10
    project_ratio: 0.25
    history_ratio: 0.40
    user_ratio: 0.10
    reserve_ratio: 0.15
  rag_heavy:
    system_ratio: 0.10
    project_ratio: 0.35
    history_ratio: 0.30
    user_ratio: 0.10
    reserve_ratio: 0.15
  history_heavy:
    system_ratio: 0.10
    project_ratio: 0.15
    history_ratio: 0.50
    user_ratio: 0.10
    reserve_ratio: 0.15

# Active preset (one of the keys above, or "custom")
active_preset: "balanced"

# Emergency truncation settings
emergency:
  # If total exceeds window after all strategies, truncate from middle
  enabled: true
  # Keep at least this many recent messages no matter what
  min_recent_messages: 2
  # Maximum chars for emergency-truncated text blocks
  max_block_chars: 2000

# Compression settings (delegates to ConversationCompressor)
compression:
  # Strategy override ("auto" = use compressor default)
  strategy: "auto"

# Report retention
report:
  # Keep last N reports in memory for API access
  max_retained: 10

# Stable prompt prefix. When enabled, the per-turn volatile blocks
# (ranked memory, web results, archive snippets, project retrieval)
# leave the leading system message and ride one trailing context message
# placed after the history and before the user turn, so the leading
# bytes -- and the KV cache a local engine computed over them -- survive
# from turn to turn. Applies to the optimizer pipeline and the manual
# fallback alike; cache identity (head plus tail) never moves with the
# placement. Rollback: enabled false.
stable_prefix:
  enabled: false

# Per-conversation slot affinity on the external llama-server. That server
# keeps one prompt-KV cache per slot and picks the slot itself unless told
# otherwise, so two conversations share one routinely -- the second either
# evicts the first's cached prefix or is decoded on attention state computed
# over the first's content. When enabled, each conversation is pinned to its
# own slot, keyed on the conversation identity, the invariant head and the
# trust-envelope state; callers with no conversation identity request no slot
# rather than take one. Independent of stable_prefix: this decides WHICH
# cache is reused, that one decides whether there is anything worth reusing.
# Ignored by every other backend. Rollback: enabled false.
slot_affinity:
  enabled: false
