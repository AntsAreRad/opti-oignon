    particles: []
    time_nouns: [semaine, mois, annee, matin, soir, soiree, nuit, jour, fois, trimestre, heure, sprint]
    auxiliaries: [est, sont, etait, etaient, ete, a, ont, avait, avaient, sera, seront, fut, peut, peuvent, doit,
                  doivent, va, vont]
    subject_pronouns: [je, j, nous, il, elle, "on", ils, elles, vous, tu]
    owner_pronouns: []
    datives: [a, avec, pour]
    courtesy: [veuillez, svp, stp, ok, oui, merci, super, parfait, bon, ah, oh, salut, bonjour]
    adverbs: [aussi, ensuite, maintenant, encore, alors, bien, simplement, plutot, vite, immediatement, directement,
