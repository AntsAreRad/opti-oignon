peels:
  span_turns: 4             # turns evicted together into one leaf peel
queue:
  rho: 0.5                  # a repaired peel longer than rho times its span saves too little: the span is held;
                            # the librarian's budget aims at it, and a span past it is not summarised
  exact_cover: 16           # verbatim units at or under which a cover is the fewest; above, greedy (at most 20)
  anchors: 768              # tokens of the peels layer the anchors of held spans may take
  proposals_per_day: 5      # typed decisions offered to the Core per conversation and UTC day, superseded ones included; the rest wait for a later day
  copy_shared_words: 2      # content words a summary's sentence shares with a document, tool or web page to be dropped as a copy

# What the librarian reads of the spans the Cellar holds: one statement a
# line -- the turn, who or what it speaks of, what it says of it, the words
# that say it -- kept only where the span's words bear it out
# (peels.read_statements). A burst reads, oldest first, the standing spans
# it has not read, at most per_burst of them, each call handed the words
# the user typed and the latest known subjects, at most `known`, with room
# for num_predict tokens of answer. The newer words of a question that
# names a known subject leave out a unit whose statements are of nothing
# the question refers to. No subject holds a word of `pronouns` -- "you"
# and the words of a group among them; the first-person words say the
# user. What is read is saved with the state when it persists
# (persistence.path), with the identity of the reading that made it, and
# checked again when the state is loaded: a restart reads only the spans
# not read, those whose reading the checks no longer keep, those another
# model or prompt read, and those a blank answer left; without a path, a
# restart reads them all again.
# What the newer words do with what was read (newer_words): `label` lays
# each unit read with whom it speaks of, "(about Alice)", each name in at
# most label_words words and label_chars characters, and leaves out
# nothing; `leave_out` leaves out a unit of nothing the question refers to,
# which a question that bends a word -- "releases" for a statement of "the
# release", "deploy" for "the deployment" -- can turn against the newer
# words it asks for once it names another known subject. Off as shipped;
# a machine switches the reading on in local.yaml (onion: {statements:
# {enabled: true}}), a tree that measures it here.
statements:
  enabled: false
  newer_words: label
  label_words: 6
  label_chars: 64
  per_burst: 16
  known: 32
  num_predict: 384
  fr:
    pronouns: [il, elle, ils, elles, lui, eux, leur, leurs, son, sa, ses, ce, cela, ceci, ca, celui, celle, ceux,
               celles, "on", qui, quoi, tu, toi, vous, ton, ta, tes, votre, vos, tous, toutes, tout, chacun, chacune]
    first_person: [je, j, me, m, moi, mon, ma, mes, nous, notre, nos]
  en:
    pronouns: [he, she, it, they, him, her, them, his, hers, its, their, theirs, this, that, these, those, who, whom,
               which, someone, somebody, something, one, you, your, yours, yourself, yourselves, both, all, each,
               everyone, everybody, anyone, anybody, nobody, none]
    first_person: [i, me, my, mine, myself, we, us, our, ours, ourselves]

# The switch. Off, the chat path keeps the window it has today -- the
# working-memory block, the optimizer or the history window -- and the
# librarian is never asked. On, the librarian mirrors each saved
# conversation and evicts through the gate off the interactive path, and
# each turn of a stored conversation the chat executor answers -- the
# direct, web-search, code-verify and think pipelines, the tools pipeline,
# the think pass of think and tools, self-correct's first draft -- is laid
# by the journal, with no optimizer and no history window, and refused by
# name when it cannot be laid; a turn of the tools pipeline runs its rounds
# inside that one window, and offline it is refused, never queued. The
# tool phase of think and tools, the reasoning and consensus engines, the
# cascading and speculative pipelines and self-correct's correction pass
# keep the context they build themselves. A turn of no conversation keeps
# its window.
# The maintainer turns it on.
enabled: false

# The librarian. Its shipped model is its own, never one that answers the
# chat: a summary is then written by a model the user did not talk to, and a
# contract holds this default apart from every model the shipped routes
# answer with. A machine names the model it has in local.yaml (onion:
# {librarian: {model: "<name>"}}), the chat's own included, which a small
# card may leave as the only one that fits: the chat's load then serves it
# at the context that load holds (resource_governor.yaml, ctx_floor), and
# the governor has its calls carry the chat's residence, never the run's
# shorter one below. Each call asks the resource governor for a ticket of
# its own, as a background caller, and is not sent when its span, its prompt
# and the answer's room do not fit the window it was admitted at, less the
# margin below. A run -- a burst, a close -- keeps the model resident
# between its calls and lets it go when it ends.
librarian:
  model: "qwen3:4b"        # placeholder; a machine names its own in local.yaml
  keep_alive: "5m"         # residence between the calls of a run; the run lets the model go when it ends
  min_new_turns: 8         # turns of growth before a curation fires
  max_steps_per_burst: 16  # the most spans one burst evicts, so that no burst runs away with the machine
  call_timeout_s: 120      # seconds one call may take, held by the librarian; past it the run goes on without the model
  run_budget_s: 300        # seconds of model calls after which a run starts no other: its budget and one call at most
  num_ctx: 8192            # the context each call asks the governor for, in tokens
  window_margin: 0.25      # the share of the window kept back for the token estimate's error (words x 1.3)
  # The user's words a peel shows as written are left out of the turns each
  # call gives the model, and its instructions hold a budget of words: this
  # share of what the queue's floor (queue.rho) leaves the summary once
  # those words are counted -- the gate's length bound where a peel is built
  # outside the queue. PROPOSED, not a calibration: a small model overshoots
  # a word budget.
  budget_share: 0.75       # the share of a summary's room its model is asked to keep to, one word at least
  temperature: 0.0        # with the seed below, the same turns ask for the same summary
  seed: 1                 # the sampling seed every librarian call carries
  num_predict: 256

# Persistence. With a path, every conversation's Core, Cellar, receipts,
# Peels and Flesh are written after each mirror and each accepted eviction,
# and read back -- re-hashed row by row against a root -- when the process
# next sees the conversation. Empty: the onion lives in the process and a
# restart starts it over. A relative path resolves under the data directory.
# A machine names its own file in local.yaml (onion: {persistence: {path:
# "onion.db"}}), under the data directory: no root or drive, no ~, no "..",
# and a name that names a file.
# Processes that share the file -- the server, the terminal that opened one
# of its conversations -- each read what another saved since at their next
# use of the conversation, and never write over it: a save that finds a
# later one is refused by name and writes nothing.
# The table holds conversation text, so an unencrypted connection is a
# refusal by name unless require_encryption is set to false here -- here
# only: local.yaml does not set it.
persistence:
  path: ""
  require_encryption: true

# What the queue counted -- bursts, evictions by rung, refusals by motive,
# spans it asked its librarian nothing about and why, the memory block,
# proposals, the mirror, the residence, the store -- a conversation read
# again or gone since another process saved it, a stale save refused --
# and the native core's share, kept across processes in a file of
# aggregates: names and numbers, never a word of a conversation nor its
# id. The status route and
# the terminal's /status show them. They are written at the end of each
# burst and close, after each decision on a proposal and each listing that
# opens deferred ones, when the terminal session ends by /quit, the end of
# its input or an interruption (a hang-up or a kill writes nothing), and
# from the chat path at a turn once flush_every_s has passed since the last
# write; what a process counted since its last write is lost if it stops
# before the next. A relative path lies under the data directory; an empty
# one keeps the counts in the process alone.
counters:
  path: "onion_counters.json"
  flush_every_s: 60
