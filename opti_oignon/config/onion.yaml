# Onion memory -- window budget, in tokens
# =========================================
# The model always sees a small, bounded, deterministically assembled window.
# The composer refuses a budget whose layer caps plus the generation reserve
# exceed the window, so the numbers below must add up.
#
# Assembly order is fixed: core, receipts, peels, flesh, turn.

# The whole window the model sees, generation reserve included.
window: 12288

# Headroom left for generation. Never assembled into.
reserve: 2048

layers:
  core: 1024        # pinned invariants; never cut, refused if over
  receipts: 512     # a line per evicted span (key, turns, kind, origins); the oldest fold into one
  peels: 3072       # retrieved episode summaries, cut to fit, whole items only
  flesh: 5120       # last turns verbatim; a turn leaves only with a receipt
  turn: 512         # the current turn; refused if over, never truncated

# The eviction gate, with two faces. A span leaves the flesh only once its
# peel answers the recall probes drawn from the span, class by class, and
# says nothing the span does not hold: a name, a date, a number or a code
# block the span lacks, and a deciding sentence with no typed decision
# behind it, are refused by name. The thresholds are the design's PROPOSED
# defaults, not a calibration: on the fixtures a single wrong entity or
# date in a four-turn span passes the probes at 0.7, and the second face
# refuses it. Calibrating them on real conversations is a host measurement,
# still owed.
gate:
  decision_threshold: 0.9   # decision-class probes (polarity counts)
  episodic_threshold: 0.7   # entity, number and date probes
  code_threshold: 1.0       # code probes: a lost marker is a block the model no longer knows of
  # A deciding sentence of a summary whose subject -- its first word that
  # is no function word -- is one of these words reports what another
  # speaker said, and needs no typed decision behind it. Each word stands
  # with its plural in -s; lower-case ASCII, accents folded. An empty table
  # ({}) holds every deciding sentence to a typed decision.
  reporters:
    en: [assistant, model, agent, bot, tool, output, log, document, file, attachment, page, site, web, search,
         result, source, article, paper, report, author, email, message]
    fr: [assistant, assistante, modele, agent, outil, sortie, journal, document, fichier, piece, page, site, web,
         recherche, resultat, source, article, rapport, auteur, courriel, message]
  # The bounds of a summary against its span, each refused by name with its
  # figure. Novelty is the share of the summary's content words that its
  # span holds no word of the same key for (folded, the final s off, the
  # first five letters); function words, figures, the words decisions are
  # told with and the reporters are not counted. The length ratio is the
  # summary's words over its span's, code included: a summary longer than
  # its span saves nothing, and the verbatim turns stay, shorter and exact.
  # PROPOSED defaults, not a calibration: on the fixtures a faithful summary
  # reads at most a tenth new and one that drifts two thirds or more, and a
  # faithful summary that tells who said what can be longer than a short
  # span. Calibrating both on real conversations is a host measurement,
  # still owed.
  max_novelty: 0.5          # the most of a summary's content words its span may hold no word for
  max_length_ratio: 1.0     # the most words a summary may write per word of its span
  # The floor of the probes against their span: the least share of the facts
  # the span holds that its probes must ask for -- its names, dates, numbers,
  # fenced blocks and typed decisions, read again piece by piece as the second
  # face reads a summary, never by the native core. A probe set is not taken
  # on trust: one that asks for less judged the summary on less than its span
  # holds, and the verbatim turns stay, refused by name with the facts no
  # probe asks for. On the fixtures every probe set the generator draws asks
  # for every fact; the floor holds a native twin, a caller or a later
  # generator to the same. Calibrating it on real conversations is a host
  # measurement, still owed.
  probe_floor: 1.0          # the least share of a span's facts its probes must ask for
  # What the probes recall of the facts a reader keeps, class by class: of
  # size facts a reader marked in the labelled fixture set the contracts
  # read, recalled had a probe drawn for them, of their class, at their
  # turn, with their answer. Read with one version of the generator and one
  # lexicon (its fingerprint, quoted): a gate whose generator or lexicon
  # differs carries no recall and says so, and the figure is never
  # borrowed. A contract reads it again and holds this table to it. A
  # fixture figure, not a calibration: the recall on real conversations is
  # a host measurement, still owed.
  probe_recall:
    source: fixture
    generator: 7
    lexicon: "7ec69b482a6c"
    classes:
      entity: {size: 15, recalled: 12}
      date: {size: 12, recalled: 10}
      number: {size: 20, recalled: 20}
      code: {size: 10, recalled: 10}
      decision: {size: 14, recalled: 14}

# The words a decision is said with, in French and in English. Besides a
# marker ("decided", "on va"), a typed sentence decides when an act of a
# language follows a subject of the same language, at most reach words
# before it, or when an act opens it. Each act belongs to a class, and a
# summary keeps a decision only by keeping an act of each class the
# decision carries, in either language, with its dates and numbers in any
# writing. A wider reach finds more decisions and keeps more verbatim; a
# narrower one, fewer. Words are lower-case ASCII, accents folded. Under acts,
# lemmas the rules inflect: French verbs in -er and -ir, English verbs by
# their spelling, a member of several words by its first. Under as_written,
# forms taken as they stand. Refused by name: a form in two classes, a
# member carrying a negation or a subject of its language, a capital or a
# letter outside ASCII, an empty class, a reach that is not a whole number
# of words, one or more. "use", "utiliser", "prendre",
# "passer a" and "move to" stay out: too common outside a decision. The
# subject "on" is quoted: bare, YAML reads it as a boolean.
decisions:
  fr:
    subjects: ["on", je, j, nous]
    reach: 3
    acts:
      keep: [garder, conserver, rester sur]
      drop: [abandonner, laisser tomber, renoncer]
      choose: [choisir, opter]
      prefer: [preferer]
      avoid: [eviter]
      switch: [remplacer, migrer, basculer]
    as_written:
      choose: [retenir, retiens, retient, retenons, retenez, retiennent, retenu, retenue, retenus, retenues,
               retiendra, retiendrons, partir sur, pars sur, part sur, partons sur, partez sur, partent sur,
               parti sur, partis sur, partira sur, partirons sur]
  en:
    subjects: [we, i, let]
    reach: 3
    acts:
      keep: [keep, retain, stick with, stay with]
      drop: [drop, abandon, ditch, give up]
      choose: [choose, pick, select, opt, go with, settle on]
      prefer: [prefer]
      avoid: [avoid]
      switch: [switch, replace, migrate]
    as_written:
      keep: [kept, stuck with]
      drop: [gave up, given up]
      choose: [chose, chosen, went with, gone with]
      prefer: [would rather, d rather]

peels:
  span_turns: 4             # turns evicted together into one leaf peel
queue:
  rho: 0.5                  # a repaired peel longer than rho times its span saves too little: the span is held
  exact_cover: 16           # verbatim units at or under which a cover is the fewest; above, greedy (at most 20)
  anchors: 768              # tokens of the peels layer the anchors of held spans may take
  proposals_per_day: 5      # typed decisions offered to the Core per conversation and UTC day, superseded ones included; the rest wait for a later day
  copy_shared_words: 2      # content words a summary's sentence shares with a document, tool or web page to be dropped as a copy

# The switch. Off, the chat path keeps the working-memory block it has today
# and the librarian is never asked; on, the librarian mirrors each saved
# conversation, evicts through the gate off the interactive path, and its
# block replaces today's when it has one. The maintainer turns it on.
enabled: false

# The librarian. Its model is its own, never one that answers the chat: a
# summary is written by a model the user did not talk to, and a contract
# holds this default apart from every model the shipped routes answer with;
# any model can be named here. Each call asks the resource governor for a
# ticket of its own, as a background caller, and is not sent when its span,
# its prompt and the answer's room do not fit the window it was admitted at,
# less the margin below. A run -- a burst, a close -- keeps the model
# resident between its calls and lets it go when it ends.
librarian:
  model: "qwen3:4b"        # placeholder until the host measurement picks one
  keep_alive: "5m"         # residence between the calls of a run; the run lets the model go when it ends
  min_new_turns: 8         # turns of growth before a curation fires
  max_steps_per_burst: 16  # the most spans one burst evicts, so that no burst runs away with the machine
  call_timeout_s: 120      # seconds one call may take, held by the librarian; past it the run goes on without the model
  run_budget_s: 300        # seconds of model calls after which a run starts no other: its budget and one call at most
  num_ctx: 8192            # the context each call asks the governor for, in tokens
  window_margin: 0.25      # the share of the window kept back for the token estimate's error (words x 1.3)
  temperature: 0.0        # with the seed below, the same turns ask for the same summary
  seed: 1                 # the sampling seed every librarian call carries
  num_predict: 256

# Persistence. With a path, every conversation's Core, Cellar, receipts,
# Peels and Flesh are written after each mirror and each accepted eviction,
# and read back -- re-hashed row by row against a root -- when the process
# next sees the conversation. Empty: the onion lives in the process and a
# restart starts it over. A relative path resolves under the data directory.
# The table holds conversation text, so an unencrypted connection is a
# refusal by name unless require_encryption is set to false here.
persistence:
  path: ""
  require_encryption: true

# What the queue counted -- bursts, evictions by rung, refusals by motive,
# the memory block, proposals, the mirror, the residence -- and the native
# core's share, kept across processes in a file of aggregates: names and
# numbers, never a word of a conversation nor its id. The status route and
# the terminal's /status show them. They are written at the end of each
# burst and close, after each decision on a proposal and each listing that
# opens deferred ones, when the terminal session ends by /quit, the end of
# its input or an interruption (a hang-up or a kill writes nothing), and
# from the chat path at a turn once flush_every_s has passed since the last
# write; what a process counted since its last write is lost if it stops
# before the next. A relative path lies under the data directory; an empty
# one keeps the counts in the process alone.
counters:
  path: "onion_counters.json"
  flush_every_s: 60
