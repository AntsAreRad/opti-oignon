    authorities: [systeme, assistant, assistante, ia, developpeur, administrateur, operateur, consignes, instructions]
    ing_verbs: []
    ed_verbs: []
    past_forms: []
    user_subjects: [utilisateur, utilisatrice, utilisateurs, utilisatrices, humain, humaine, humains, humaines]
    telling: [veut, voulait, voudrait, veulent, demande, demandait, demandent, souhaite, souhaitait, prefere,
              preferait, dit, disait, aime, aimerait, ordonne, ordonnait, commande, commandait, exige, exigeait,
              prie, priait, charge, chargeait, conseille, recommande, impose, ecrit, ecrivait, repond, repondait,
              affirme, mentionne, cite]
    coordinators: [et, puis, et puis, ensuite, et ensuite, mais, ainsi que]
    conditions: [si, s il, sauf, seulement, uniquement, quand, lorsque, lorsqu, des que, tant que, jusqu a, apres,
                 avant, a condition, pourvu que, selon, d apres]
    subordinators: [qui, dont, ou, comme, car, puisque, lorsque, quand, tandis]
    quote_nouns: [mail, courriel, courriels, message, messages, lettre, document, documents, page, fichier, texte,
                  commentaire, citation, capture, ticket, transcription, sms, texto, spam, arnaque, hameconnage]
    wanting: [veut, voulait, voudrait, veulent, souhaite, souhaitait, prefere, preferait, aime, aimerait, exige,
              exigeait, veux, voudrais, voulons, voudrions, aimerais, aimerions, souhaiterais, souhaitons,
              prefererais, exigeons]
    question_verbs: [savoir, comprendre, connaitre, apprendre, voir, entendre, discuter, demander, verifier, comparer,
                     relire, lire]
    first_person: [je, nous, "on"]
    announcers: [voici, voila, ci dessous, ce qui suit, ci apres]
  en:
