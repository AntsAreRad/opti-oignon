# Onion memory -- window budget, in tokens
# =========================================
# The model always sees a small, bounded, deterministically assembled window,
# under the budget of one rung of the context ladder (ctx_ladder in
# resource_governor.yaml). Each table below, plus the reserve, is its rung:
# the composer refuses a configuration where a rung has no table, a table
# holds for no rung, a layer is missing or unknown, a table does not hold at
# its rung, or a layer shrinks as the rung grows -- each by name.
#
# Assembly order is fixed: system, core, receipts, peels, flesh, tail, turn.
#   system    the system prompt; refused if over, never cut
#   core      pinned invariants; refused if over, never cut
#   receipts  a line per evicted span (key, turns, kind, origins); the oldest fold into one
#   peels     retrieved episode summaries, cut to fit, whole items only
#   flesh     last turns verbatim; a turn leaves only with a receipt
#   tail      the sources a turn brings (retrieval, web, documents, a tool
#             turn's earlier calls), as data
#   turn      the current turn; refused if over, never truncated

# Headroom left for generation, the same at every rung. Never assembled into.
reserve: 2048

# The rung whose table a caller that names no rung composes under, less the
# system prompt and the tail, which such a caller does not lay: at 16384 that
# leaves the window before rungs, 12288, with its five caps unchanged.
home_rung: 16384

# The share of the Core's cap a pin, a supersession or an accepted proposal
# leaves free, and one token more for the counts' rounding down. What lands
# is counted as the conversation's last turn counted it (before any, as the
# heaviest counter a turn may hand over would); held back a quarter, it
# still fits a later turn that counts it up to a third more. A turn that
# counts it over its cap gets no onion block, refused by name, and a
# supersession that does not grow the Core is never refused.
core_margin: 0.25

budgets:
  4096:  {system: 512,  core: 256,  receipts: 64,   peels: 256,  flesh: 512,   tail: 192,  turn: 256}
  8192:  {system: 768,  core: 512,  receipts: 256,  peels: 1024, flesh: 2304,  tail: 896,  turn: 384}
  16384: {system: 1024, core: 1024, receipts: 512,  peels: 3072, flesh: 5120,  tail: 3072, turn: 512}
  32768: {system: 1536, core: 1024, receipts: 1024, peels: 6144, flesh: 12288, tail: 7680, turn: 1024}

# The journal: a turn's window laid as messages, the same bytes from one
# turn to the next up to the current turn, so the engine reuses the longest
# prefix. Its order is fixed: system, core, peels, receipts, flesh, tail,
# turn. Its rung is home_rung's table and the turn's need, never named here;
# a section that is missing a key it needs, names one it does not know or
# names home_rung is refused by name, every reason at once. catch_up,
# burst_mark, tool_room and tool_result_cap may be left out: they read at
# their defaults.
journal:
  # The share of a window's count held back for the counter's error: the
  # answer is held to what the context leaves past the count with this share
  # added.
  margin: 0.15
  # The room the answer always keeps, in tokens: a window is laid under the
  # count that leaves it, past the margin -- the Flesh gives first, its
  # oldest turns laid over a shadow, then the tail is cut to the room the
  # rest leaves it; the window is refused count when the system prompt, the
  # Core, the turn, the region and the digest alone leave less. A whole
  # number, under the smallest rung.
  answer_floor: 1024
  # What one image of the current turn is charged, in tokens, counted on
  # its message: the counter reads none. The current turn comes first: the
  # charge takes its room from the Flesh, whose cap at the rung it reduces,
  # and raises the rung only when even the whole Flesh cap cannot hold it.
  # A provisional charge, on the high side, until it is measured. A whole
  # number of at least 1.
  image_tokens: 1024
  # The tokens a message costs past its content, in a chat template.
  message_overhead: 4
  # The share of the tail's cap each kind of source a turn brings may take,
  # cut to whole items: the memory, the retrieval, the web results, and the
  # calls the earlier turns of a tool turn's conversation made (tool), the
  # newest first; a turn's documents are held to theirs, never cut. Every
  # kind is named. They sum to 1 at most. The memory may also borrow the
  # shares of the kinds the turn brings nothing of, the room the region of
  # accepted peels leaves of the peels' cap and the room the system prompt,
  # the Core and the turn leave of theirs -- at 4096 its own share does not
  # hold its envelope -- room it gives up before any other part of the
  # window. A memory share of 0 keeps the memory out.
  tail_shares: {memory: 0.35, rag: 0.25, web: 0.1, tool: 0.1, document: 0.2}
  # How a plan catches the Flesh up when it finds it over its cap at the
  # conversation's own rung -- a conversation the process had not seen, one
  # older than the onion, one grown past its cap -- with no model, before the
  # turn is admitted: the turns past the newest ``reach`` leave bare, a span
  # at a time, then the queue runs at most ``max_steps`` steps on the rungs
  # that need no model, then bare spans until the Flesh fits. Only while no
  # burst holds the conversation's slot: otherwise nothing is evicted and
  # the window lays the overflow over a shadow, one line naming the turns
  # it set aside, charged to the Flesh room they freed. Whole numbers; reach
  # at least 1.
  catch_up: {reach: 64, max_steps: 32}
  # Where a burst aims once a journal laid the conversation: this share of
  # the Flesh's cap at its rung, so the Flesh is evicted, with the model,
  # before a window has to lay its overflow over a shadow. A share in (0, 1].
  burst_mark: 0.8
  # What a turn of the tools pipeline holds back at composition, in tokens
  # at the home rung, for the transcript its rounds append -- the calls and
  # their results -- past the answer's floor: the Flesh gives first, over a
  # shadow. At another rung it is held to that rung's context in
  # proportion. A whole number of at least 1; with the answer floor, under
  # home_rung. Provisional, until it is measured.
  tool_room: 3072
  # The most one tool's result may take in that transcript, in tokens at
  # the home rung, its envelope and the line naming it included, and held
  # to another rung in proportion: a longer result is cut, with a line
  # saying how much of it is shown. A whole number of at least 1.
  # Provisional, until it is measured.
  tool_result_cap: 1536

# The eviction gate, with two faces. A span leaves the flesh only once its
# peel answers the recall probes drawn from the span, class by class, and
# says nothing the span does not hold: a name, a date, a number or a code
# block the span lacks, and a deciding sentence with no typed decision
# behind it, are refused by name. The thresholds are the design's PROPOSED
# defaults, not a calibration: on the fixtures a single wrong entity or
# date in a four-turn span passes the probes at 0.7, and the second face
# refuses it. Calibrating them on real conversations is a host measurement,
# still owed.
gate:
  decision_threshold: 0.9   # decision-class probes (polarity counts)
  episodic_threshold: 0.7   # entity, number and date probes
  code_threshold: 1.0       # code probes: a lost marker is a block the model no longer knows of
  # A deciding sentence of a summary whose subject -- its first word that
  # is no function word -- is one of these words reports what another
  # speaker said, and needs no typed decision behind it. Each word stands
  # with its plural in -s; lower-case ASCII, accents folded. An empty table
  # ({}) holds every deciding sentence to a typed decision.
  reporters:
    en: [assistant, model, agent, bot, tool, output, log, document, file, attachment, page, site, web, search,
         result, source, article, paper, report, author, email, message]
    fr: [assistant, assistante, modele, agent, outil, sortie, journal, document, fichier, piece, page, site, web,
         recherche, resultat, source, article, rapport, auteur, courriel, message]
  # The bounds of a summary against its span, each refused by name with its
  # figure. Novelty is the share of the summary's content words that its
  # span holds no word of the same key for (folded, the final s off, the
  # first five letters); function words, figures, the words decisions are
  # told with and the reporters are not counted. The length ratio is the
  # summary's words over its span's, code included: a summary longer than
  # its span saves nothing, and the verbatim turns stay, shorter and exact.
  # PROPOSED defaults, not a calibration: on the fixtures a faithful summary
  # reads at most a tenth new and one that drifts two thirds or more, and a
  # faithful summary that tells who said what can be longer than a short
  # span. Calibrating both on real conversations is a host measurement,
  # still owed.
  max_novelty: 0.5          # the most of a summary's content words its span may hold no word for
  max_length_ratio: 1.0     # the most words a summary may write per word of its span
  # The floor of the probes against their span: the least share of the facts
  # the span holds that its probes must ask for -- its names, dates, numbers,
  # fenced blocks and typed decisions, read again piece by piece as the second
  # face reads a summary, never by the native core. A probe set is not taken
  # on trust: one that asks for less judged the summary on less than its span
  # holds, and the verbatim turns stay, refused by name with the facts no
  # probe asks for. On the fixtures every probe set the generator draws asks
  # for every fact; the floor holds a native twin, a caller or a later
  # generator to the same. Calibrating it on real conversations is a host
  # measurement, still owed.
  probe_floor: 1.0          # the least share of a span's facts its probes must ask for
  # What the probes recall of the facts a reader keeps, class by class: of
  # size facts a reader marked in the labelled fixture set the contracts
  # read, recalled had a probe drawn for them, of their class, at their
  # turn, with their answer. Read with one version of the generator and one
  # lexicon (its fingerprint, quoted): a gate whose generator or lexicon
  # differs carries no recall and says so, and the figure is never
  # borrowed. A contract reads it again and holds this table to it. A
  # fixture figure, not a calibration: the recall on real conversations is
  # a host measurement, still owed.
  probe_recall:
    source: fixture
    generator: 7
    lexicon: "7ec69b482a6c"
    classes:
      entity: {size: 15, recalled: 12}
      date: {size: 12, recalled: 10}
      number: {size: 20, recalled: 20}
      code: {size: 10, recalled: 10}
      decision: {size: 14, recalled: 14}

# The words a decision is said with, in French and in English. Besides a
# marker ("decided", "on va"), a typed sentence decides when an act of a
# language follows a subject of the same language, at most reach words
# before it, or when an act opens it. Each act belongs to a class, and a
# summary keeps a decision only by keeping an act of each class the
# decision carries, in either language, with its dates and numbers in any
# writing. A wider reach finds more decisions and keeps more verbatim; a
# narrower one, fewer. Words are lower-case ASCII, accents folded. Under acts,
# lemmas the rules inflect: French verbs in -er and -ir, English verbs by
# their spelling, a member of several words by its first. Under as_written,
# forms taken as they stand. Refused by name: a form in two classes, a
# member carrying a negation or a subject of its language, a capital or a
# letter outside ASCII, an empty class, a reach that is not a whole number
# of words, one or more. "use", "utiliser", "prendre",
# "passer a" and "move to" stay out: too common outside a decision. The
# subject "on" is quoted: bare, YAML reads it as a boolean.
decisions:
  fr:
    subjects: ["on", je, j, nous]
    reach: 3
    acts:
      keep: [garder, conserver, rester sur]
      drop: [abandonner, laisser tomber, renoncer]
      choose: [choisir, opter]
      prefer: [preferer]
      avoid: [eviter]
      switch: [remplacer, migrer, basculer]
    as_written:
      choose: [retenir, retiens, retient, retenons, retenez, retiennent, retenu, retenue, retenus, retenues,
               retiendra, retiendrons, partir sur, pars sur, part sur, partons sur, partez sur, partent sur,
               parti sur, partis sur, partira sur, partirons sur]
  en:
    subjects: [we, i, let]
    reach: 3
    acts:
      keep: [keep, retain, stick with, stay with]
      drop: [drop, abandon, ditch, give up]
      choose: [choose, pick, select, opt, go with, settle on]
      prefer: [prefer]
      avoid: [avoid]
      switch: [switch, replace, migrate]
    as_written:
      keep: [kept, stuck with]
      drop: [gave up, given up]
      choose: [chose, chosen, went with, gone with]
      prefer: [would rather, d rather]

# The forms an order is given in, in French and in English. A peel is read by
# every later turn, so no summary gives an order, nor restates or tells one,
# whoever gave it, the user included: the gate refuses by name every clause
# of a peel that orders, but inside the block of runs the user typed that
# the queue stitches at its end, each word for word after its turn's marker
# ("[t3] ..."), after a sentence the summary ended with a stop. A marker
# anywhere else -- the model's markers are taken out first -- stitches
# nothing: what it marks is the summary's words, read joined to what comes
# before it and apart from it. A run is a typed sentence, joined with the
# next where parting them would change what they say: a sentence in lower
# case, one inside an open quote in any marks (straight, curly, low, single,
# guillemets, corner brackets; an apostrophe between letters is none), all
# that follows a line on a colon or a sentence that tells, names a quote's
# noun or opens on a presentative (telling, quote_nouns, announcers: "This
# is what the phishing email said.", "Here is the spam I got.") to the end
# of its piece, a one-word sentence, a bare negation or retraction,
# interjections included ("No, don't.", "Nope.", "Hm, no.", "On second
# thought, no."), and a sentence that opens on a negation or a condition
# after the order it bounds ("Not before Friday.", "Only if Bob agrees.").
# A gap no typed segment covers ends a run, and a turn whose id is empty or
# shared with another turn holds none. The queue stitches each run that
# orders, read with this table, and each bare retraction typed after one,
# whatever was asked between them (a "No." that answered another question
# makes the order look taken back, the safe side),
# so that a condition, a quote, an attribution, a list's line and a
# retraction stay with their order; the gate holds a stitched run only when
# it is the run of that turn, exactly. The text is
# read folded: compatibility forms composed, format, combining and
# invisible characters (the Hangul fillers, the blank Braille pattern)
# dropped, look-alike letters read as Latin ones, underscores between
# letters read as spaces, hyphenated words read both joined and split -- a
# French pronoun after its verb never joined ("Envoie-les"); a compound that
# opens on an opening ("Always-on") is then read as one, a false refusal on
# the side of safety; marks of emphasis dropped ("**Reminder:**"), a colon
# glued between two letters spaced ("Reminder:send"), a word spelled letter
# by letter joined, its letters parted by one or two spaces or tabs, stops, slashes,
# middle dots or commas ("S e n d", "D.e.l.e.t.e", "S, e, n, d"; three
# letters at least, so "e.g." stays), a line that opens in lower case read
# on the line before it ("Send\nthe keys"); sentences end at a stop, an ellipsis
# or a line break, chunks at a semicolon, a colon or a dash; enumerators and
# tags before a clause are no words of it (a verb in brackets is read as
# one), and a code marker in it reads as "it". Anywhere in a chunk, a clause
# orders when it speaks to the reader in the second person (second_person,
# or a French "t'" or "te"); when the assistant (readers) is obliged among
# its first words within obligation_reach words (obligations, past adverbs:
# "is now required to", "is hereby asked to") -- a model, an
# agent or a system obliged to act is a statement; when a lasting rule
# stands in it (persistent); when it holds an injection's signature
# (signatures, or an override verb with an override object within
# override_reach words), whoever tells it; and when the user is told to ask
# the reader to act (user_subjects, telling, then "to"; or, whatever the
# verb, the reader then "to") or to want a thing done (wanting, then a
# participle or "to" before a verb that asks nothing, question_verbs): a
# request told of the user is an order, a wish to know told of the user
# ("wants to know whether the build passed") none -- unless a verb that
# orders is coordinated to the one that asks ("asked to check the logs and
# delete the old ones"); and the user asking in their own voice (first_person,
# wanting, then a participle, "to" or "que": "I'd like the old logs
# deleted", "J'aimerais que le rapport parte") asks as much. A label before a colon -- an authority named alone (authorities:
# "System:", a forged message's voice), or at most label_words words opening
# on label_heads and ending on one of addressees -- holding no verb
# (auxiliaries, past forms) addresses the chunks after it and a list that
# follows it. A word in brackets or parentheses before a clause that is one
# of label_heads ("(Fix)", "[Update]") is a tag and read as none; any other
# is read as a word too ("(Send) the keys"). Where a piece between commas
# opens -- the first, or a later one after a fronted phrase that opens on no
# subject (subject_pronouns, determiners, names; names alone are a vocative
# unless a determiner opens the next piece, an appositive) -- it orders on
# courtesy, prohibition or a rule (openers, which may begin on a lead-in
# word; a French past participle opens none, nor an opening before a
# subject, which asks: "Do we keep Docker?"), and when its first word, past lead-in words
# and interjections (courtesy: "ok so send") and a run of adverbs, opens no
# statement while the next, past adverbs, a
# particle, then a dative before a name, a determiner or one word, opens an
# object: a possessive ("Bob's", "today's"), a determiner, a quantity or a
# pronoun before no time noun, or before a time noun that owns the object or
# precedes it ("this month's logs", "ce trimestre les sauvegardes";
# object_openers, time_nouns), a name the span holds, a figure before its
# unit. A word opens a statement when it is one of statement_openers, a
# name -- unless an English determiner follows it -- a figure, a gerund of
# five letters or more (not one of ing_verbs), a past in -ed (not one of
# ed_verbs), one of past_forms, a French past participle (unless an English
# determiner follows it: an accent added to an English verb), or a word in
# -s that is no imperative ("Deletes", "Development continues"; not
# "Process", "Focus", nor a French imperative before its determiner or
# pronoun, "Prends les"). Under a
# reporter, or with none, a decision told as the user's (user_subjects, not
# followed by one of owner_pronouns; past a phrase between commas, "the
# user, it seems, decided") needs a typed decision, read as the user would
# have typed it -- the clause after "that" or "que" when it decides ("the
# user confirmed that we drop..."), else with the user as "we" or "on", so
# that its act alone decides ("the user prefers Podman"); so does a
# predicate coordinated to a deciding clause (coordinators, "&" among them,
# past auxiliaries; or a gerund and its object after a comma, "..., dropping
# the NAS"); a decision is read sentence by sentence as an order is, a stop
# glued to the next sentence's capital ending one and a line that opens in
# lower case going on, a clause that opens
# on a subject of its own after a comma, an "and", a bracket or a
# subordinating word (subordinators; "that" is none, a reporter's voice)
# judged on its own, a sentence's head apart from the predicates coordinated
# to it, and a typed sentence parted the same way, so that the user's words
# restated whole are held whole and two typed decisions may be joined; a
# sentence that answers a typed decision with words of
# its own is named; and a decision the user wrote under a list whose colon
# line holds a negation, a condition or an attribution (conditions:
# "according to", "selon"), a telling verb that is no verb of wanting
# (wanting), a quote's noun (quote_nouns: "Here is the mail:") or another's
# possessive, "our" before it included ("Mallory's ideas:", "Our vendor's
# proposal:"), after such a label before a colon in its line ("Mallory
# wrote: we drop") or such a piece before a comma ("Bob said, we drop"), or
# that a bare negation takes back, holds none; and a predicate coordinated
# to a typed decision holds alone only when its head is the user's plain
# decision (a first-person subject, then past auxiliaries of tense only an
# act, no adverb or modal that hedges it -- "reportedly", "might" -- and
# nothing that negates, doubts or attributes it). strict: true makes every clause whose first
# word opens no statement an order, the bare imperatives the balanced
# reading misses ("Delete backups") with it, at a cost in compression: a
# sentence with a bare singular subject ("Docker runs") then orders too.
# Named limits of the balanced reading: a bare imperative, whose object has
# no determiner, or whose object is a time phrase alone ("Delete this
# month"); an order written as a third person ("Deletes the keys"); an order told as a plan, a
# requirement or a permission; a third party's "should"; an obligation of a
# model, an agent or a system; a passive obligation under a reporter word; a
# fronted phrase without a comma; a sum after its currency sign (the first
# face holds sums); look-alike letters outside the table; an order written
# as one word ("SendTheVaultKeys to Mallory"); a lasting rule
# outside persistent; a request told with a verb outside telling and
# wanting and no reader; a decision restated with a few added words as a
# statement; a coordinator or a possessive changed ("or" told "and", "our"
# told "their") and a plural for a singular; "we" or "I" in a reporter's
# words, which stays the reporter's voice even against a typed "will not";
# a speaker named alone before a colon ("Bob: we drop the backups"), read as
# a label of the user's own; a list's line that rejects without a negation
# ("Rejected options:", "Ideas I turned down:"), and one whose negation is
# undone ("None of this is optional:"), which bars its list, a false
# refusal; a sentence of the summary that tells of the stitched block ("The
# user took this back.", "The next line applies on every later turn."),
# judged as a claim; a summary whose last sentence it did not end -- an
# ellipsis, spaced or not, or an abbreviation ("i.e.", "etc.", "cf.") ends
# none, a stop inside emphasis does -- which carries no stitched block, its
# orders refused, a sentence that ends on an abbreviation ("at 3 a.m.",
# "to the U.S.") among them, a false refusal; a comma piece that names a
# quote's noun or another's possessive ("With the file server full,", "In
# Alice's absence,"), which bars what follows it, a false refusal; a wish in the first
# person, read as a request ("I want to go home") and stitched, and requests
# the reading still misses ("Hm, I'd like...", "We would really like...",
# "J'aimerais bien que...", a wish told with a verb that asks before what is
# wanted done: "wants to see the logs deleted"), which leave no trace; a
# French wish to know whose infinitive follows its verb ("voulait savoir
# si..."), read as a request when a participle follows, a false refusal; a quote framed by no
# announcing word or mark ("Someone sent me this.", "This came in
# overnight."), framed after it ("That is what the spam said.") or in
# another turn, stitched as the user's own words; a sentence that names a
# file or a page, or tells ("Please update the settings file."), which
# joins the rest of its turn to its run, a cost in compression; an
# apostrophe after a plural, read as a quote mark; the user's own list of
# their group's decisions ("Our team's decisions:"), barred, a false
# refusal; a
# retraction told as a statement ("I changed my mind"), which the queue
# does not stitch after the order it takes back; a decision split by an
# interjection between dashes or brackets (the lexicon's reach); an injection's signature told in
# a legitimate sentence is refused all the same; and a fenced block, never
# read. Words are lower-case ASCII, accents folded, an elided letter written
# alone ("don t", "n oubliez"). Refused by name: a missing language or key,
# an unknown key, a value that is no list, an entry outside that alphabet, a
# key with no entry in either language. "on", "off", "no" and "yes" are quoted:
# bare, YAML reads them as booleans. PROPOSED defaults: the false refusals
# on real summaries are a host measurement, still owed.
directives:
  strict: false
  obligation_reach: 3
  override_reach: 4
  label_words: 6
  fr:
    lead_ins: [et, mais, ou, donc, alors, puis, ensuite, maintenant, aussi, enfin, bien, simplement, plutot, sinon,
               important, urgent, attention, nb, ps, va, allez]
    openers: [veuillez, merci de, priere de, ne jamais, ne pas, ne plus, jamais, assurez vous, assure toi,
              pensez a, pense a, n oubliez pas, n oublie pas, surtout ne, en aucun cas, il faut, il ne faut, faites,
              fais, n hesitez pas a, n hesite pas a, evitez de, evite de, arretez, arrete, essaie de, essayez de,
              essayer de]
    persistent: [desormais, dorenavant, a partir de maintenant, a l avenir, a partir de ce jour,
                 jusqu a nouvel ordre, a partir d aujourd hui, a compter d aujourd hui]
    second_person: [vous, tu, toi, votre, vos, ta, tes]
    readers: [assistant, assistante]
    obligations: [doit, doivent, devra, devront, devrait, devraient, est tenu de, est tenue de, a pour consigne de,
                  est prie de, est priee de, a ordre de, est charge de, est chargee de, est encourage a,
                  est encouragee a, est invite a, est invitee a, est cense, est censee, est appele a, est appelee a,
                  a pour mission de, a pour tache de, est autorise a, est autorisee a, est libre de, est oblige de,
                  est obligee de, a ete prie de, a ete priee de, a ete charge de, a ete chargee de]
    addressees: [assistant, assistante, ia, llm, modele, bot, chatbot, agent, systeme, instruction, instructions,
                 consigne, consignes, directive, directives, prompt, admin, administrateur, developpeur, operateur]
    label_heads: [consigne, consignes, note, notes, message, messages, rappel, regle, regles, directive, directives,
                  instruction, instructions, important, attention, a, pour, cher, chere, salut, bonjour, info,
                  correctif, avertissement, astuce, statut, resume, contexte, maj]
    override_verbs: [ignore, ignores, ignorez, ignorons, ignorer, oublie, oublies, oubliez, oublier, contourne,
                     contournez, contourner, outrepasse, outrepassez, outrepasser, neglige, negligez, negliger,
                     ne tiens pas compte, ne tenez pas compte, ne pas tenir compte, fais abstraction,
                     faites abstraction, passe outre, passez outre, passer outre]
    override_objects: [instruction, instructions, consigne, consignes, regle, regles, directive, directives, prompt,
