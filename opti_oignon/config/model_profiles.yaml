# =============================================================================
# OPTI-OIGNON v1.5.8 -- MODEL PROFILES
# =============================================================================
# Capability profiles for each Ollama model.
# Used by the Smart Router for automatic per-step model selection.
#
# Fields:
#   display_name       -- Human-readable name for the UI
#   capabilities       -- General capabilities [code, reasoning, general, ...]
#   strengths          -- Specific strong points
#   weaknesses         -- Known weak points
#   context_window     -- Context window size (tokens)
#   speed_tier         -- fast | medium | slow
#   quality_tier       -- high | medium | low
#   recommended_for    -- Recommended task types
#   not_recommended_for-- Task types to avoid
#   task_scores        -- Numeric score per task type (0.0-1.0) for smart routing
# =============================================================================

profiles:

