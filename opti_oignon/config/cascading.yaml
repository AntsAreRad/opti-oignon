# Cascading Inference Configuration
# 3-tier model cascade with automatic quality-based escalation.

enabled: false

# Tier definitions (ordered: fast -> standard -> power).
# Each tier generates a response, scores it, and either serves it
# (if score >= threshold) or escalates to the next tier.
tiers:
  - name: fast
    model: "qwen3:8b"
    threshold: 0.7
    max_tokens: 2048
    temperature: 0.5
  - name: standard
    model: "qwen3:32b"
    threshold: 0.6
    max_tokens: 4096
    temperature: 0.5
  - name: power
    model: "deepseek-r1:32b"
    threshold: 0.0
    max_tokens: 8192
    temperature: 0.5

# Retry once within the same tier before escalating.
max_retries_per_tier: 1

# Timeout per tier in seconds.
timeout_per_tier_seconds: 30

# Optional per-criterion weights for quality assessment.
# Maps to compute_heuristic_quality dimensions.
score_weights:
  completeness: 0.4
  coherence: 0.4
  hallucination_penalty: 0.2
