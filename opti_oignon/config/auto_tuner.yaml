# Auto-Tuner Configuration
# Automatically finds optimal inference parameters for the user's hardware.
# Runs on demand only (never automatically). Persists best config per model.
# Inspired by llama-optimus.

auto_tuner:
  enabled: true             # Feature available (runs only on user request)
  warmup_runs: 3            # Throwaway runs before measuring
  benchmark_tokens: 128     # Tokens to generate per benchmark run
  benchmark_timeout_s: 120  # Bound on one benchmark request, in seconds
  benchmark_prompt_tokens: 128  # Prompt tokens for processing speed test
  trials_per_param: 3       # Average over N runs for stability
  auto_apply: false         # If true, apply best config automatically after tuning

# Parameter search space.
# Each parameter lists candidate values to try.
#   threads           -- auto: the counts the resource governor's thread plan
#                        gives this machine at each run -- the plan itself
#                        (the machine's physical cores less the reserve:
#                        the engine runs in a process of its own, which the
#                        server's quota does not bind), each fraction below
#                        of it rounded up, and the
#                        fastest class's core count -- never past the plan;
#                        the baseline runs at the plan's count. A list of
#                        whole numbers is swept as written.
#   threads_fractions -- with auto: fractions of the plan's count, each above
#                        0 and under 1.
# A count the sweep confirms (measured, applied per call by the engine, on
# one placement, no slower than the baseline) is kept by the governor for
# that model, engine and placement, and planned from then on.
parameter_space:
  batch_size: [512, 1024, 2048, 4096]
  ubatch_size: [256, 512, 1024]
  threads: auto
  threads_fractions: [0.5, 0.75]
  flash_attention: [true, false]
  # gpu_layers is auto-detected from model size, not searched.
