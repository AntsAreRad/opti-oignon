# =============================================================================
# OPTI-OIGNON v1.4.0 — PRESETS CONFIGURATION
# =============================================================================
# Presets = combinaisons pre-configurees (tache + modele + prompt + parametres)
# Ils peuvent etre auto-detectes via les keywords dans le message utilisateur.
#
# Structure:
#   id:
#     name: Nom affiche
#     task: Type de tache (code_r, code_python, etc.)
#     model: Modele Ollama (ou null pour auto-routing)
#     temperature: 0.0-1.0
#     prompt_variant: standard | detailed | concise
#     description: Description affichee
#     icon: Emoji/icone
#     tags: [liste, de, tags]
#     keywords: [mots, cles, pour, auto-detection]
#     detection_weight: 1.0 (poids dans le scoring)
# =============================================================================

presets:
  r_analysis:
    name: "R - Analyse Ecologie"
    task: "code_r"
    model: "qwen3-coder:30b"
    temperature: 0.2
    prompt_variant: "standard"
    description: "Code R pour analyses ecologiques (vegan, tidyverse, ggplot2)"
    icon: "R"
    tags: ["code", "R", "ecologie"]
    keywords: ["ggplot", "dplyr", "vegan", "tidyverse", "diversity", "ordination", "phyloseq"]
    detection_weight: 1.2

  python_code:
    name: "Python - Code"
    task: "code_python"
    model: "qwen3-coder:30b"
    temperature: 0.2
    prompt_variant: "standard"
    description: "Code Python (data science, bioinformatics, automation)"
    icon: "Py"
    tags: ["code", "python"]
    keywords: ["python", "pandas", "numpy", "import", "def", "class", "matplotlib"]
    detection_weight: 1.0

  debug:
    name: "Debug"
    task: "debug_r"
    model: "qwen3-coder:30b"
    temperature: 0.1
    prompt_variant: "detailed"
    description: "Debugging R/Python (erreurs, traceback, correction)"
    icon: "Bug"
    tags: ["debug", "fix"]
    keywords: ["error", "erreur", "bug", "traceback", "fix", "corriger", "doesn't work"]
    detection_weight: 1.1

  writing:
    name: "Redaction Scientifique"
    task: "scientific_writing"
    model: "qwen3:32b"
    temperature: 0.3
    prompt_variant: "standard"
    description: "Redaction academique, rapports, abstracts"
    icon: "Doc"
    tags: ["writing", "academic"]
    keywords: ["abstract", "introduction", "methods", "paper", "article", "rediger"]
    detection_weight: 1.0

  general:
    name: "General"
    task: "simple_question"
    model: null
    temperature: 0.5
    prompt_variant: "standard"
    description: "Questions generales, explications, discussions"
    icon: "Chat"
    tags: ["general"]
    keywords: []
    detection_weight: 0.5

  reasoning:
    name: "Raisonnement Complexe"
    task: "planning_deep"
    model: "deepseek-r1:32b"
    temperature: 0.4
    prompt_variant: "detailed"
    description: "Analyse approfondie, planification, decisions complexes"
    icon: "Brain"
    tags: ["reasoning", "analysis"]
    keywords: ["analyze", "think", "compare", "evaluate", "strategy", "decision"]
    detection_weight: 1.0

  linux:
    name: "Linux / Bash"
    task: "linux"
    model: "qwen3-coder:30b"
    temperature: 0.2
    prompt_variant: "standard"
    description: "Commandes bash, scripts shell, administration systeme"
    icon: "Term"
    tags: ["linux", "bash"]
    keywords: ["bash", "terminal", "command", "apt", "systemctl", "docker", "git"]
    detection_weight: 1.0

# Ordre d'affichage dans l'interface
display_order:
  - "general"
  - "r_analysis"
  - "python_code"
  - "debug"
  - "writing"
  - "reasoning"
  - "linux"

# Auto-selection par type de tache
auto_select:
  code_r: "r_analysis"
  code_python: "python_code"
  debug_r: "debug"
  debug_python: "debug"
  scientific_writing: "writing"
  planning_deep: "reasoning"
  linux: "linux"
  simple_question: "general"

# Raccourcis clavier (Ctrl+Shift+<key>)
shortcuts:
  "1": "general"
  "2": "r_analysis"
  "3": "python_code"
  "4": "debug"
